<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>الزنبقة الزرقاء</title>

    <style>

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #05020a;

            touch-action: none;
        }

        #scene {
            position: relative;

            width: 100vw;
            height: 100vh;

            overflow: hidden;
        }

        canvas {
            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            display: block;

            pointer-events: none;
        }

        /* طبقة النص فقط */
        #textCanvas {
            z-index: 3;
        }

        #flowerCanvas {
            z-index: 1;
        }

        #bloodCanvas {
            z-index: 2;
        }

    </style>
</head>

<body>

<div id="scene">

    <!-- الزهرة -->
    <canvas id="flowerCanvas"></canvas>

    <!-- الدم -->
    <canvas id="bloodCanvas"></canvas>

    <!-- النص -->
    <canvas id="textCanvas"></canvas>

</div>


<script>

/* =========================================================
   CANVASES
========================================================= */

const flowerCanvas =
    document.getElementById("flowerCanvas");

const bloodCanvas =
    document.getElementById("bloodCanvas");

const textCanvas =
    document.getElementById("textCanvas");


const flowerCtx =
    flowerCanvas.getContext("2d");

const bloodCtx =
    bloodCanvas.getContext("2d");

const textCtx =
    textCanvas.getContext("2d");


/* =========================================================
   VARIABLES
========================================================= */

let W;
let H;

let cx;
let cy;

let dpr;

let drawQueue = [];
let currentIndex = 0;

let petalEndPoints = [];

let stemPoints = [];

let isDrawingFlower = true;

let isBleeding = false;


/* =========================================================
   RESIZE
========================================================= */

function resizeCanvas() {

    W = window.innerWidth;
    H = window.innerHeight;

    dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    const canvases = [
        flowerCanvas,
        bloodCanvas,
        textCanvas
    ];


    canvases.forEach(canvas => {

        canvas.width =
            Math.floor(W * dpr);

        canvas.height =
            Math.floor(H * dpr);

        canvas.style.width =
            W + "px";

        canvas.style.height =
            H + "px";
    });


    flowerCtx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    bloodCtx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    textCtx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    cx = W / 2;
    cy = H / 2;


    buildFlower();
}


/* =========================================================
   CLEAR ALL
========================================================= */

function clearAll() {

    flowerCtx.clearRect(
        0,
        0,
        W,
        H
    );

    bloodCtx.clearRect(
        0,
        0,
        W,
        H
    );

    textCtx.clearRect(
        0,
        0,
        W,
        H
    );


    flowerCtx.fillStyle =
        "#05020a";

    flowerCtx.fillRect(
        0,
        0,
        W,
        H
    );
}


/* =========================================================
   BUILD FLOWER
========================================================= */

function buildFlower() {

    drawQueue = [];

    currentIndex = 0;

    petalEndPoints = [];


    const MAX_RADIUS =
        Math.min(W, H) * 0.35;

    const CENTER_GAP =
        Math.min(
            130,
            H * 0.18
        );


    /* =====================================================
       STEM
    ===================================================== */

    function generateStemPoints() {

        const points = [];

        const steps = 150;

        const startY =
            Math.min(
                H - 10,
                cy + 350
            );

        const startX =
            cx + 20;


        for (
            let i = 0;
            i <= steps;
            i++
        ) {

            const t =
                i / steps;


            const x =
                startX -
                t * 22;


            const y =
                startY -
                t *
                (
                    startY -
                    (
                        cy +
                        CENTER_GAP
                    )
                );


            points.push({
                x: x,
                y: y
            });
        }


        return points;
    }


    stemPoints =
        generateStemPoints();


    for (
        let i = 1;
        i < stemPoints.length;
        i++
    ) {

        drawQueue.push({
            type: "stem",
            idx: i
        });
    }


    /* =====================================================
       FLOWER BASE
    ===================================================== */

    for (
        let i = 0;
        i < 80;
        i++
    ) {

        const t =
            i / 79;


        const yOffset =
            CENTER_GAP -
            t * 40;


        const xOffset =
            -15 +
            t * 30;


        drawQueue.push({

            type: "base",

            x:
                cx +
                xOffset,

            y:
                cy +
                yOffset,

            w:
                15 +
                t * 25,

            h:
                10 +
                t * 15,

            color:
                `rgba(
                    20,
                    25,
                    45,
                    ${0.4 - t * 0.15}
                )`
        });
    }


    /* =====================================================
       PETALS
    ===================================================== */

    const lilyPetals = [];

    const numPetals = 6;

    const ringsPerPetal = 130;


    for (
        let p = 0;
        p < numPetals;
        p++
    ) {

        const petalAngle =
            (
                p /
                numPetals
            ) *
            Math.PI *
            2;


        let finalX = cx;
        let finalY = cy;


        for (
            let j = 0;
            j < ringsPerPetal;
            j++
        ) {

            const t =
                j /
                (ringsPerPetal - 1);


            const distance =
                5 +
                t *
                MAX_RADIUS;


            const angleOffset =
                Math.sin(
                    j * 0.018 +
                    p * 1.7
                )
                *
                0.12
                *
                t;


            const angle =
                petalAngle +
                angleOffset;


            const shapeFactor =
                Math.sin(
                    t * Math.PI
                );


            const w =
                10 +
                shapeFactor *
                25;


            const h =
                15 +
                shapeFactor *
                30;


            let alpha =
                0.28 -
                t * 0.20;


            alpha =
                Math.max(
                    0.025,
                    alpha
                );


            let r =
                30 +
                t * 50;


            let g =
                30 +
                t * 60;


            let b =
                100 +
                t * 80;


            const fade =
                Math.pow(
                    t,
                    2.5
                );


            r =
                r *
                (1 - fade)
                +
                5 *
                fade;


            g =
                g *
                (1 - fade)
                +
                5 *
                fade;


            b =
                b *
                (1 - fade)
                +
                5 *
                fade;


            lilyPetals.push({

                distance:
                    distance,

                angle:
                    angle,

                w:
                    w,

                h:
                    h,

                color:
                    `rgba(
                        ${Math.floor(r)},
                        ${Math.floor(g)},
                        ${Math.floor(b)},
                        ${alpha}
                    )`
            });


            finalX =
                cx +
                distance *
                Math.cos(angle);


            finalY =
                cy +
                distance *
                Math.sin(angle);
        }


        /* نقطة بداية النزيف */
        petalEndPoints.push({

            startX:
                finalX,

            startY:
                finalY,

            angle:
                petalAngle
        });
    }


    lilyPetals.sort(
        (a, b) =>
            a.distance -
            b.distance
    );


    drawQueue =
        drawQueue.concat(
            lilyPetals
        );


    /* =====================================================
       STAMENS
    ===================================================== */

    const stamens = [];


    for (
        let s = 0;
        s < 6;
        s++
    ) {

        const stamenAngle =
            (
                s / 6
            ) *
            Math.PI *
            2
            +
            0.2;


        for (
            let j = 0;
            j < 35;
            j++
        ) {

            const dist =
                10 +
                j * 2.2;


            if (
                dist >
                MAX_RADIUS * 0.65
            ) {
                break;
            }


            stamens.push({

                distance:
                    dist,

                angle:
                    stamenAngle,

                w:
                    2,

                h:
                    j < 30
                    ? 4
                    : 12,

                color:
                    j < 30

                    ?

                    `rgba(
                        200,
                        190,
                        230,
                        ${0.25 -
                        (j / 35) *
                        0.15}
                    )`

                    :

                    "rgba(255,255,255,0.3)"
            });
        }
    }


    stamens.sort(
        (a, b) =>
            a.distance -
            b.distance
    );


    drawQueue =
        drawQueue.concat(
            stamens
        );
}


/* =========================================================
   DRAW FLOWER
========================================================= */

function drawItemFromQueue() {

    if (!isDrawingFlower) {
        return;
    }


    if (
        currentIndex >=
        drawQueue.length
    ) {

        isDrawingFlower =
            false;


        /* ابدأ النزيف */
        setTimeout(
            startBleeding,
            500
        );


        return;
    }


    const item =
        drawQueue[
            currentIndex
        ];


    /* =====================================================
       STEM
    ===================================================== */

    if (
        item.type ===
        "stem"
    ) {

        const previous =
            stemPoints[
                item.idx - 1
            ];


        const current =
            stemPoints[
                item.idx
            ];


        flowerCtx.beginPath();


        flowerCtx.moveTo(
            previous.x,
            previous.y
        );


        flowerCtx.lineTo(
            current.x,
            current.y
        );


        flowerCtx.strokeStyle =
            "rgba(35,45,60,0.72)";


        flowerCtx.lineWidth =
            6.5;


        flowerCtx.lineCap =
            "round";


        flowerCtx.shadowBlur =
            0;


        flowerCtx.stroke();
    }


    /* =====================================================
       BASE
    ===================================================== */

    else if (
        item.type ===
        "base"
    ) {

        flowerCtx.save();


        flowerCtx.translate(
            item.x,
            item.y
        );


        flowerCtx.beginPath();


        flowerCtx.ellipse(
            0,
            0,
            item.w,
            item.h,
            0,
            0,
            Math.PI * 2
        );


        flowerCtx.fillStyle =
            item.color;


        flowerCtx.fill();


        flowerCtx.restore();
    }


    /* =====================================================
       PETALS / STAMENS
    ===================================================== */

    else {

        const ring =
            item;


        const x =
            cx +
            ring.distance *
            Math.cos(
                ring.angle
            );


        const y =
            cy +
            ring.distance *
            Math.sin(
                ring.angle
            );


        flowerCtx.save();


        flowerCtx.translate(
            x,
            y
        );


        flowerCtx.rotate(
            ring.angle +
            Math.PI / 2
        );


        flowerCtx.beginPath();


        flowerCtx.ellipse(
            0,
            0,
            ring.w,
            ring.h,
            0,
            0,
            Math.PI * 2
        );


        flowerCtx.strokeStyle =
            ring.color;


        flowerCtx.lineWidth =
            ring.distance < 30
            ? 7
            : 5;


        flowerCtx.shadowBlur =
            10;


        flowerCtx.shadowColor =
            "rgba(30,80,180,0.15)";


        flowerCtx.stroke();


        flowerCtx.restore();
    }


    currentIndex++;


    setTimeout(
        drawItemFromQueue,
        35
    );
}


/* =========================================================
   BLOOD DROPS
========================================================= */

let drops = [];


function startBleeding() {

    isBleeding =
        true;


    drops = [];


    /*
       كل بتلة سيكون لها
       أكثر من سيل.
    */

    petalEndPoints.forEach(
        (end, index) => {

            for (
                let i = 0;
                i < 3;
                i++
            ) {

                drops.push({

                    /* بداية القطرة */
                    x:
                        end.startX,

                    y:
                        end.startY,


                    /* الأصل */
                    startX:
                        end.startX,

                    startY:
                        end.startY,


                    /* تقدم الحركة */
                    progress:
                        -i * 0.22,


                    /* السرعة */
                    speed:
                        0.0045 +
                        Math.random() *
                        0.0015,


                    /* طول السيل */
                    length:
                        120 +
                        Math.random() *
                        100,


                    /* حجم القطرة */
                    size:
                        3.5 +
                        Math.random() *
                        2.5,


                    /* انحراف */
                    drift:
                        (
                            Math.random() -
                            0.5
                        ) *
                        25,


                    /* مسار */
                    trail:
                        [],


                    petal:
                        index
                });
            }
        }
    );


    requestAnimationFrame(
        animateBlood
    );
}


/* =========================================================
   ANIMATE BLOOD
========================================================= */

function animateBlood(time) {

    if (!isBleeding) {
        return;
    }


    /*
       لا نمسح Canvas الدم بالكامل.

       هذا مهم جداً لأننا نريد
       أن يبقى أثر السيلان.
    */


    let allFinished =
        true;


    for (
        const drop of drops
    ) {

        drop.progress +=
            drop.speed;


        if (
            drop.progress <
            0
        ) {

            allFinished =
                false;

            continue;
        }


        if (
            drop.progress <
            1
        ) {

            allFinished =
                false;
        }


        const p =
            Math.min(
                drop.progress,
                1
            );


        /*
           حركة النزول
        */

        const distance =
            p *
            drop.length;


        /*
           انحناء بسيط أثناء النزول
        */

        drop.x =
            drop.startX
            +
            Math.sin(
                p *
                Math.PI *
                2
                +
                drop.petal
            ) *
            7
            +
            drop.drift *
            p;


        drop.y =
            drop.startY +
            distance;


        /*
           حفظ مسار القطرة
        */

        drop.trail.push({

            x:
                drop.x,

            y:
                drop.y
        });


        if (
            drop.trail.length >
            35
        ) {

            drop.trail.shift();
        }


        /* =================================================
           رسم السيل
        ================================================= */

        if (
            drop.trail.length >
            1
        ) {

            bloodCtx.save();


            bloodCtx.beginPath();


            bloodCtx.moveTo(
                drop.trail[0].x,
                drop.trail[0].y
            );


            for (
                let i = 1;
                i <
                drop.trail.length;
                i++
            ) {

                bloodCtx.lineTo(
                    drop.trail[i].x,
                    drop.trail[i].y
                );
            }


            bloodCtx.strokeStyle =
                "rgba(35,125,255,0.72)";


            bloodCtx.lineWidth =
                drop.size *
                0.85;


            bloodCtx.lineCap =
                "round";


            bloodCtx.lineJoin =
                "round";


            bloodCtx.shadowBlur =
                16;


            bloodCtx.shadowColor =
                "rgba(30,130,255,0.8)";


            bloodCtx.stroke();


            bloodCtx.restore();
        }


        /* =================================================
           القطرة في المقدمة
        ================================================= */

        bloodCtx.save();


        bloodCtx.shadowBlur =
            20;


        bloodCtx.shadowColor =
            "rgba(40,150,255,0.9)";


        const gradient =
            bloodCtx.createRadialGradient(

                drop.x -
                drop.size * 0.3,

                drop.y -
                drop.size * 0.5,

                1,

                drop.x,

                drop.y,

                drop.size * 2.2
            );


        gradient.addColorStop(
            0,
            "rgba(180,230,255,1)"
        );


        gradient.addColorStop(
            0.3,
            "rgba(50,160,255,1)"
        );


        gradient.addColorStop(
            1,
            "rgba(20,85,220,0.85)"
        );


        bloodCtx.fillStyle =
            gradient;


        bloodCtx.beginPath();


        bloodCtx.ellipse(

            drop.x,

            drop.y,

            drop.size,

            drop.size * 1.7,

            0,

            0,

            Math.PI * 2
        );


        bloodCtx.fill();


        bloodCtx.restore();
    }


    if (
        allFinished
    ) {

        isBleeding =
            false;


        /*
           بعد انتهاء الدم
           انتظر قليلاً ثم اكتب الجملة.
        */

        setTimeout(
            showLoveText,
            700
        );


        return;
    }


    requestAnimationFrame(
        animateBlood
    );
}


/* =========================================================
   TEXT
========================================================= */

function showLoveText() {

    const text =
        "I love u samo";


    const yPos =
        cy + 160;


    /*
       مهم جداً:

       لا نمسح flowerCanvas.
       لا نمسح bloodCanvas.

       النص موجود في Canvas
       منفصل وشفاف.
    */


    textCtx.clearRect(
        0,
        0,
        W,
        H
    );


    textCtx.font =
        "bold 48px 'Brush Script MT', 'Great Vibes', 'Comic Sans MS', cursive, sans-serif";


    textCtx.textAlign =
        "center";


    textCtx.textBaseline =
        "middle";


    let index = 0;


    const interval =
        setInterval(
            () => {

                /*
                   نمسح طبقة النص فقط.
                */

                textCtx.clearRect(
                    0,
                    0,
                    W,
                    H
                );


                const partial =
                    text.substring(
                        0,
                        index
                    );


                /*
                   الظل
                */

                textCtx.shadowBlur =
                    0;


                textCtx.fillStyle =
                    "#11152c";


                textCtx.fillText(

                    partial,

                    cx - 2,

                    yPos + 2
                );


                /*
                   النيون
                */

                textCtx.shadowBlur =
                    18;


                textCtx.shadowColor =
                    "#3399ff";


                textCtx.fillStyle =
                    "#3399ff";


                textCtx.fillText(

                    partial,

                    cx,

                    yPos
                );


                index++;


                if (
                    index >
                    text.length
                ) {

                    clearInterval(
                        interval
                    );
                }

            },

            150
        );
}


/* =========================================================
   START
========================================================= */

resizeCanvas();


clearAll();


setTimeout(
    drawItemFromQueue,
    600
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        /*
           لا نعيد الرسم أثناء
           الأنيميشن حتى لا يختفي المشهد.
        */

    }
);

</script>

</body>
</html>
