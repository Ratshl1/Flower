<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الزنبقة الزرقاء - نزيف ورسالة</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #05020e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
            background-color: #05020e;
        }
    </style>
</head>
<body>
    <canvas id="flowerCanvas"></canvas>

    <script>
        const canvas = document.getElementById('flowerCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        let drawQueue = [];
        let currentIndex = 0;
        let petalEndPoints = [];

        let isDrawingFlower = true;
        let isBleeding = false;
        let bleedStep = 0;

        const MAX_RADIUS = Math.min(canvas.width, canvas.height) * 0.35; 
        const CENTER_GAP = 130; 

        // -----------------------------------------
        // 1. توليد الساق
        // -----------------------------------------
        function generateStemPoints() {
            const points = [];
            const steps = 120;
            const startY = cy + 350; 
            const startX = cx + 20; 
            for (let i = 0; i <= steps; i++) {
                let t = i / steps;
                let x = startX - (t * 22); 
                let y = startY - (t * (350 - CENTER_GAP)); 
                points.push({x, y});
            }
            return points;
        }

        const stemPoints = generateStemPoints();
        for (let i = 0; i < stemPoints.length; i++) {
            drawQueue.push({ type: 'stem', idx: i });
        }

        // -----------------------------------------
        // 2. قاعدة الزهرة
        // -----------------------------------------
        function generateReceptacle() {
            const loops = [];
            for (let i = 0; i < 80; i++) {
                let t = i / 80;
                let yOffset = CENTER_GAP - (t * 40); 
                let xOffset = -15 + (t * 30);
                let w = 15 + t * 25;
                let h = 10 + t * 15;
                let color = `rgba(20, 25, 45, ${0.4 - t * 0.15})`;
                loops.push({ type: 'base', x: cx + xOffset, y: cy + yOffset, w, h, angle: 0, color });
            }
            return loops;
        }
        drawQueue = drawQueue.concat(generateReceptacle());

        // -----------------------------------------
        // 3. بتلات الزهرة (ألوان زرقاء وأطراف سوداء)
        // -----------------------------------------
        const lilyPetals = [];
        const numPetals = 6;
        const ringsPerPetal = 120;

        for (let p = 0; p < numPetals; p++) {
            let petalAngle = (p / numPetals) * 2 * Math.PI;
            for (let j = 0; j < ringsPerPetal; j++) {
                let t = j / ringsPerPetal;
                let distance = 5 + (t * MAX_RADIUS);
                if (distance > MAX_RADIUS) break; 
                let angleOffset = Math.sin(j * 0.02) * 0.3; 
                let angle = petalAngle + angleOffset;
                
                let shapeFactor = Math.sin(t * Math.PI); 
                let w = 10 + shapeFactor * 25; 
                let h = 15 + shapeFactor * 30; 
                
                let alpha = 0.25 - (t * 0.20); 
                alpha = Math.max(0.02, alpha);
                
                let r = 30 + t * 50;
                let g = 30 + t * 60;
                let b = 100 + t * 80;
                
                let fadeToBlack = Math.pow(t, 2.5);
                r = r * (1 - fadeToBlack) + 5 * fadeToBlack;
                g = g * (1 - fadeToBlack) + 5 * fadeToBlack;
                b = b * (1 - fadeToBlack) + 5 * fadeToBlack;
                
                let color = `rgba(${Math.floor(r)}, ${Math.floor(g)}, ${Math.floor(b)}, ${alpha})`;
                lilyPetals.push({ distance, angle, w, h, color });

                // تخزين نقاط نهاية البتلات
                if (j === ringsPerPetal - 1) {
                    let endX = cx + distance * Math.cos(angle);
                    let endY = cy + distance * Math.sin(angle);
                    petalEndPoints.push({ x: endX, y: endY, angle: petalAngle });
                }
            }
        }
        lilyPetals.sort((a, b) => a.distance - b.distance);
        drawQueue = drawQueue.concat(lilyPetals);

        // -----------------------------------------
        // 4. الأسدية البيضاء (فوق الأزرق)
        // -----------------------------------------
        const stamens = [];
        for (let s = 0; s < 6; s++) {
            let stamenAngle = (s / 6) * 2 * Math.PI + 0.2;
            for (let j = 0; j < 35; j++) {
                let dist = 10 + j * 2.2;
                if (dist > MAX_RADIUS * 0.65) break;
                let color = j < 30 ? 
                    `rgba(200, 190, 230, ${0.25 - (j/35)*0.15})` : 
                    `rgba(255, 255, 255, 0.3)`;
                stamens.push({ distance: dist, angle: stamenAngle, w: 2, h: j < 30 ? 4 : 12, color });
            }
        }
        stamens.sort((a, b) => a.distance - b.distance);
        drawQueue = drawQueue.concat(stamens);

        // -----------------------------------------
        // 5. إعدادات رسم البتلات
        // -----------------------------------------
        ctx.lineWidth = 5.5;
        ctx.shadowBlur = 15; 
        ctx.shadowColor = 'rgba(30, 20, 60, 0.2)'; 

        const DRAW_DELAY_MS = 55;

        ctx.fillStyle = '#05020e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // ============================================
        // مرحلة النزيف (قطرات تسيل بوضوح)
        // ============================================
        function startBleeding() {
            isDrawingFlower = false;
            isBleeding = true;
            startBleedDrops();
        }

        function startBleedDrops() {
            if (bleedStep > 50) {
                isBleeding = false;
                setTimeout(showLoveText, 500);
                return;
            }
            
            let t = bleedStep / 50;
            
            // رسم قطرة دم من كل طرف بتلة
            for (let p = 0; p < petalEndPoints.length; p++) {
                let end = petalEndPoints[p];
                
                // حركة القطرة لأسفل
                let progressX = end.x - (end.x - cx) * t * 0.5; // تتجه للمركز قليلاً
                let progressY = end.y + 10 + (t * 180); // تنزل للأسفل
                
                ctx.save();
                // **قمنا بتكبير القطرة وجعل توهجها واضحاً جداً**
                ctx.shadowBlur = 30;
                ctx.shadowColor = 'rgba(60, 140, 255, 0.8)';
                
                ctx.beginPath();
                // شكل القطرة (دائرة أو بيضاوية مائلة)
                ctx.ellipse(progressX, progressY, 8 + t * 5, 11 + t * 7, end.angle, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(40, 140, 255, ${Math.max(0.3, 0.9 - t * 0.5)})`;
                ctx.fill();
                ctx.restore();
            }
            
            bleedStep++;
            setTimeout(startBleedDrops, 100);
        }

        // ============================================
        // مرحلة الجملة (واضحة، والقطرات ترسمها)
        // ============================================
        function showLoveText() {
            let text = "I love u samo";
            
            // **إزالة التوهج عن النص ليصبح واضحاً**
            ctx.shadowBlur = 0; 
            
            // استخدام خط عريض وواضح
            ctx.font = "bold 48px 'Georgia', 'Brush Script MT', 'Great Vibes', serif";
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            let yPos = cy + 160; // فوق الجذع مباشرة
            let step = 0;
            
            let textInterval = setInterval(() => {
                if (step > text.length) {
                    clearInterval(textInterval);
                    return;
                }
                
                let partialText = text.substring(0, step);
                
                // **جعل النص بلون أزرق داكن/رمادي مع حدود بيضاء ليبرز**
                ctx.fillStyle = '#a0b8d9'; 
                ctx.strokeStyle = '#2a3a5a';
                ctx.lineWidth = 3;
                
                // رسم النص مع الحدود ليصبح مقروءاً جداً
                ctx.strokeText(partialText, cx, yPos);
                ctx.fillText(partialText, cx, yPos);
                
                // **جعل القطرات اللامعة هي التي تُحيط بالحروف (الدم يرسم الحروف)**
                for (let d = 0; d < 6; d++) {
                    let dropX = cx + (Math.random() - 0.5) * (step * 25);
                    let dropY = yPos + (Math.random() - 0.5) * 25;
                    
                    ctx.save();
                    // القطرات هي وحدها التي تتوهج
                    ctx.shadowBlur = 30;
                    ctx.shadowColor = '#4d94ff';
                    
                    ctx.beginPath();
                    ctx.arc(dropX, dropY, 3 + Math.random() * 4, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(40, 120, 255, ${0.7 + Math.random() * 0.3})`;
                    ctx.fill();
                    ctx.restore();
                }
                
                step++;
            }, 170);
        }

        // ============================================
        // حلقة الرسم الرئيسية
        // ============================================
        function drawItemFromQueue() {
            if (!isDrawingFlower) return;

            if (currentIndex >= drawQueue.length) {
                isDrawingFlower = false;
                setTimeout(startBleeding, 300);
                return;
            }

            const item = drawQueue[currentIndex];

            if (item.type === 'stem') {
                ctx.beginPath();
                ctx.moveTo(stemPoints[Math.max(0, item.idx - 1)].x, stemPoints[Math.max(0, item.idx - 1)].y);
                ctx.lineTo(stemPoints[item.idx].x, stemPoints[item.idx].y);
                ctx.strokeStyle = 'rgba(35, 45, 60, 0.7)';
                ctx.lineWidth = 6.5;
                ctx.shadowBlur = 0;
                ctx.stroke();
                ctx.shadowBlur = 15;
            } 
            else if (item.type === 'base') {
                ctx.save();
                ctx.translate(item.x, item.y);
                ctx.beginPath();
                ctx.ellipse(0, 0, item.w, item.h, 0, 0, Math.PI * 2);
                ctx.fillStyle = item.color;
                ctx.fill();
                ctx.restore();
            } 
            else {
                const ring = item;
                const x = cx + ring.distance * Math.cos(ring.angle);
                const y = cy + ring.distance * Math.sin(ring.angle);
                
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(ring.angle + Math.PI / 2);
                
                ctx.beginPath();
                ctx.ellipse(0, 0, ring.w, ring.h, 0, 0, Math.PI * 2);
                ctx.strokeStyle = ring.color;
                ctx.lineWidth = ring.distance < 30 ? 7 : 5;
                ctx.stroke();
                
                ctx.restore();
            }

            currentIndex++;
            setTimeout(drawItemFromQueue, DRAW_DELAY_MS);
        }

        setTimeout(drawItemFromQueue, 600);

    </script>
</body>
</html>
