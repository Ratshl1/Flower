<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الزنبقة الزرقاء ودم النيون</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #05020e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
            background-color: #05020e;
        }
    </style>
</head>
<body>
    <canvas id="flowerCanvas"></canvas>

    <script>
        const canvas = document.getElementById('flowerCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        let drawQueue = [];
        let currentIndex = 0;
        let petalEndPoints = []; // تخزين أطراف البتلات

        let isDrawingFlower = true;
        let isBleeding = false;
        let bleedStep = 0;

        const MAX_RADIUS = Math.min(canvas.width, canvas.height) * 0.35; 
        const CENTER_GAP = 130; 

        // -----------------------------------------
        // 1. توليد الساق
        // -----------------------------------------
        function generateStemPoints() {
            const points = [];
            const steps = 120;
            const startY = cy + 350; 
            const startX = cx + 20; 
            for (let i = 0; i <= steps; i++) {
                let t = i / steps;
                let x = startX - (t * 22); 
                let y = startY - (t * (350 - CENTER_GAP)); 
                points.push({x, y});
            }
            return points;
        }

        const stemPoints = generateStemPoints();
        for (let i = 0; i < stemPoints.length; i++) {
            drawQueue.push({ type: 'stem', idx: i });
        }

        // -----------------------------------------
        // 2. قاعدة الزهرة
        // -----------------------------------------
        function generateReceptacle() {
            const loops = [];
            for (let i = 0; i < 80; i++) {
                let t = i / 80;
                let yOffset = CENTER_GAP - (t * 40); 
                let xOffset = -15 + (t * 30);
                let w = 15 + t * 25;
                let h = 10 + t * 15;
                let color = `rgba(20, 25, 45, ${0.4 - t * 0.15})`;
                loops.push({ type: 'base', x: cx + xOffset, y: cy + yOffset, w, h, angle: 0, color });
            }
            return loops;
        }
        drawQueue = drawQueue.concat(generateReceptacle());

        // -----------------------------------------
        // 3. بتلات الزهرة (اللون الأزرق الترابي)
        // -----------------------------------------
        const lilyPetals = [];
        const numPetals = 6;
        const ringsPerPetal = 120;

        for (let p = 0; p < numPetals; p++) {
            let petalAngle = (p / numPetals) * 2 * Math.PI;
            for (let j = 0; j < ringsPerPetal; j++) {
                let t = j / ringsPerPetal;
                let distance = 5 + (t * MAX_RADIUS);
                if (distance > MAX_RADIUS) break; 
                let angleOffset = Math.sin(j * 0.02) * 0.3; 
                let angle = petalAngle + angleOffset;
                
                let shapeFactor = Math.sin(t * Math.PI); 
                let w = 10 + shapeFactor * 25; 
                let h = 15 + shapeFactor * 30; 
                
                let alpha = 0.25 - (t * 0.20); 
                alpha = Math.max(0.02, alpha);
                
                let r = 30 + t * 50;
                let g = 30 + t * 60;
                let b = 100 + t * 80;
                
                let fadeToBlack = Math.pow(t, 2.5);
                r = r * (1 - fadeToBlack) + 5 * fadeToBlack;
                g = g * (1 - fadeToBlack) + 5 * fadeToBlack;
                b = b * (1 - fadeToBlack) + 5 * fadeToBlack;
                
                let color = `rgba(${Math.floor(r)}, ${Math.floor(g)}, ${Math.floor(b)}, ${alpha})`;
                lilyPetals.push({ distance, angle, w, h, color });

                // تسجيل أطراف البتلات لنزول الدم منها
                if (j === ringsPerPetal - 1) {
                    let endX = cx + distance * Math.cos(angle);
                    let endY = cy + distance * Math.sin(angle);
                    petalEndPoints.push({ x: endX, y: endY, angle: petalAngle });
                }
            }
        }
        lilyPetals.sort((a, b) => a.distance - b.distance);
        drawQueue = drawQueue.concat(lilyPetals);

        // -----------------------------------------
        // 4. الأسدية البيضاء (تتراكب فوق الأزرق)
        // -----------------------------------------
        const stamens = [];
        for (let s = 0; s < 6; s++) {
            let stamenAngle = (s / 6) * 2 * Math.PI + 0.2;
            for (let j = 0; j < 35; j++) {
                let dist = 10 + j * 2.2;
                if (dist > MAX_RADIUS * 0.65) break;
                let color = j < 30 ? 
                    `rgba(200, 190, 230, ${0.25 - (j/35)*0.15})` : 
                    `rgba(255, 255, 255, 0.3)`;
                stamens.push({ distance: dist, angle: stamenAngle, w: 2, h: j < 30 ? 4 : 12, color });
            }
        }
        stamens.sort((a, b) => a.distance - b.distance);
        drawQueue = drawQueue.concat(stamens);

        // -----------------------------------------
        // 5. إعدادات الرسم البطيء
        // -----------------------------------------
        ctx.lineWidth = 5.5;
        ctx.shadowBlur = 15; 
        ctx.shadowColor = 'rgba(30, 20, 60, 0.2)'; 

        const DRAW_DELAY_MS = 55;

        ctx.fillStyle = '#05020e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // ----------------------
        // مرحلة النزيف (الدم الأزرق البراق يسيل من الأطراف)
        // ----------------------
        function startBleeding() {
            isDrawingFlower = false;
            isBleeding = true;
            startBleedDrops();
        }

        function startBleedDrops() {
            if (bleedStep > 50) {
                isBleeding = false;
                setTimeout(showLoveText, 400); // بعد انتهاء النزيف، تبدأ الجملة
                return;
            }
            
            let t = bleedStep / 50;
            
            // رسم قطرات الدم الزرقاء البراقة
            for (let p = 0; p < petalEndPoints.length; p++) {
                let end = petalEndPoints[p];
                
                // حركة القطرة: تنزلق من البتلة للأسفل
                let progressX = end.x - (end.x - cx) * t * 0.6;
                let progressY = end.y + (t * 190); // النزول للأسفل
                
                ctx.save();
                // قطرة الدم بلون أزرق نيون براق جداً
                let alpha = 0.9 - t * 0.4;
                ctx.shadowBlur = 25;
                ctx.shadowColor = '#4d94ff'; // توهج أزرق نيون
                
                ctx.beginPath();
                ctx.ellipse(progressX, progressY, 6 + t * 4, 8 + t * 6, end.angle, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(40, 120, 255, ${Math.max(0.2, alpha)})`;
                ctx.fill();
                ctx.restore();
            }
            
            bleedStep++;
            setTimeout(startBleedDrops, 100);
        }

        // ----------------------
        // مرحلة الجملة (ترسم بواسطة الدم الأزرق البراق)
        // ----------------------
        function showLoveText() {
            let text = "I love u samo";
            
            // **ضبط الخط ليكون واضحاً جداً على الجوال**
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#66b3ff'; // وهج أزرق فاتح جداً
            ctx.font = "bold 45px 'Dancing Script', 'Great Vibes', 'Brush Script MT', 'Georgia', serif";
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // **المكان المثالي: فوق الجذع (أسفل الزهرة مباشرة)**
            let yPos = cy + 160; 
            let step = 0;
            
            let textInterval = setInterval(() => {
                if (step > text.length) {
                    clearInterval(textInterval);
                    ctx.shadowBlur = 0; // إلغاء التوهج بعد الانتهاء
                    return;
                }
                
                let partialText = text.substring(0, step);
                
                // لون الحروف أزرق براق وواضح جداً
                ctx.fillStyle = '#4d94ff';
                ctx.fillText(partialText, cx, yPos);
                
                // **قطرات صغيرة تنثر بجانب كل حرف (لتحاكي أن الدم هو من يرسم الجملة)**
                for (let d = 0; d < 4; d++) {
                    let dropX = cx + (Math.random() - 0.5) * (step * 30);
                    let dropY = yPos + (Math.random() - 0.5) * 30;
                    ctx.beginPath();
                    ctx.arc(dropX, dropY, 2 + Math.random() * 3, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(40, 120, 255, ${0.4 + Math.random() * 0.5})`;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#4d94ff';
                    ctx.fill();
                }
                
                step++;
            }, 170); // كتابة بطيئة وجميلة
        }

        // ----------------------
        // حلقة الرسم الرئيسية
        // ----------------------
        function drawItemFromQueue() {
            if (!isDrawingFlower) return;

            if (currentIndex >= drawQueue.length) {
                isDrawingFlower = false;
                setTimeout(startBleeding, 400); // انتظر قليلاً ثم ابدأ النزيف
                return;
            }

            const item = drawQueue[currentIndex];

            if (item.type === 'stem') {
                ctx.beginPath();
                ctx.moveTo(stemPoints[Math.max(0, item.idx - 1)].x, stemPoints[Math.max(0, item.idx - 1)].y);
                ctx.lineTo(stemPoints[item.idx].x, stemPoints[item.idx].y);
                ctx.strokeStyle = 'rgba(35, 45, 60, 0.7)';
                ctx.lineWidth = 6.5;
                ctx.shadowBlur = 0;
                ctx.stroke();
                ctx.shadowBlur = 15;
            } 
            else if (item.type === 'base') {
                ctx.save();
                ctx.translate(item.x, item.y);
                ctx.beginPath();
                ctx.ellipse(0, 0, item.w, item.h, 0, 0, Math.PI * 2);
                ctx.fillStyle = item.color;
                ctx.fill();
                ctx.restore();
            } 
            else {
                const ring = item;
                const x = cx + ring.distance * Math.cos(ring.angle);
                const y = cy + ring.distance * Math.sin(ring.angle);
                
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(ring.angle + Math.PI / 2);
                
                ctx.beginPath();
                ctx.ellipse(0, 0, ring.w, ring.h, 0, 0, Math.PI * 2);
                ctx.strokeStyle = ring.color;
                ctx.lineWidth = ring.distance < 30 ? 7 : 5;
                ctx.stroke();
                
                ctx.restore();
            }

            currentIndex++;
            setTimeout(drawItemFromQueue, DRAW_DELAY_MS);
        }

        setTimeout(drawItemFromQueue, 600);

        window.addEventListener('resize', () => {
            // يُفضل تحديث الصفحة لتجنب أي تشوش عند تغيير الحجم
        });

    </script>
</body>
</html>
