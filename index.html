<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Blue Lily</title>

<style>

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #05020a;

    touch-action: none;
}

#scene {
    position: relative;

    width: 100vw;
    height: 100vh;

    overflow: hidden;
}

canvas {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    display: block;

    pointer-events: none;
}

#flowerCanvas {
    z-index: 1;
}

#bloodCanvas {
    z-index: 2;
}

</style>

</head>

<body>

<div id="scene">

<canvas id="flowerCanvas"></canvas>
<canvas id="bloodCanvas"></canvas>

</div>


<script>

/* =========================================================
   CANVAS
========================================================= */

const flowerCanvas =
document.getElementById("flowerCanvas");

const bloodCanvas =
document.getElementById("bloodCanvas");

const flowerCtx =
flowerCanvas.getContext("2d");

const bloodCtx =
bloodCanvas.getContext("2d");


/* =========================================================
   GLOBAL
========================================================= */

let W;
let H;

let cx;
let cy;

let dpr;

let drawQueue = [];
let currentIndex = 0;

let petalEndPoints = [];

let stemPoints = [];

let isDrawingFlower = true;

let isBleeding = false;

let drops = [];


/* =========================================================
   RESIZE
========================================================= */

function resizeCanvas() {

    W = window.innerWidth;
    H = window.innerHeight;

    dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    [flowerCanvas, bloodCanvas].forEach(canvas => {

        canvas.width =
            Math.floor(W * dpr);

        canvas.height =
            Math.floor(H * dpr);

        canvas.style.width =
            W + "px";

        canvas.style.height =
            H + "px";
    });


    flowerCtx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    bloodCtx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    cx = W / 2;

    /*
       جعل مركز الوردة أعلى قليلاً
       حتى يكون هناك مكان للجملة
       والجذع.
    */

    cy =
        H * 0.43;


    buildFlower();
}


/* =========================================================
   BUILD FLOWER
========================================================= */

function buildFlower() {

    drawQueue = [];

    currentIndex = 0;

    petalEndPoints = [];


    const MAX_RADIUS =
        Math.min(W, H) * 0.35;


    const CENTER_GAP =
        Math.min(
            115,
            H * 0.15
        );


    /* =====================================================
       STEM
    ===================================================== */

    function generateStemPoints() {

        const points = [];

        const steps = 180;


        /*
           أهم تعديل:

           الجذع يبدأ من أسفل الشاشة
           وينتهي داخل قاعدة الزهرة نفسها.
        */

        const startY =
            Math.min(
                H - 15,
                cy + 380
            );


        const endY =
            cy + CENTER_GAP - 5;


        const startX =
            cx + 15;


        const endX =
            cx;


        for (
            let i = 0;
            i <= steps;
            i++
        ) {

            const t =
                i / steps;


            /*
               منحنى طبيعي للجذع
            */

            const curve =
                Math.sin(
                    t * Math.PI
                ) * 24;


            const x =
                startX +
                (endX - startX) * t
                -
                curve;


            const y =
                startY +
                (endY - startY) * t;


            points.push({
                x,
                y
            });
        }


        return points;
    }


    stemPoints =
        generateStemPoints();


    /*
       رسم الجذع تدريجياً
    */

    for (
        let i = 1;
        i < stemPoints.length;
        i++
    ) {

        drawQueue.push({
            type: "stem",
            idx: i
        });
    }


    /* =====================================================
       BASE OF FLOWER
    ===================================================== */

    for (
        let i = 0;
        i < 100;
        i++
    ) {

        const t =
            i / 99;


        const yOffset =
            CENTER_GAP -
            t * 42;


        const xOffset =
            -17 +
            t * 34;


        drawQueue.push({

            type: "base",

            x:
                cx +
                xOffset,

            y:
                cy +
                yOffset,

            w:
                16 +
                t * 28,

            h:
                11 +
                t * 17,

            color:
                `rgba(
                    20,
                    25,
                    55,
                    ${0.45 -
                    t * 0.18}
                )`
        });
    }


    /* =====================================================
       PETALS
    ===================================================== */

    const lilyPetals = [];

    const numPetals = 6;

    const ringsPerPetal = 135;


    for (
        let p = 0;
        p < numPetals;
        p++
    ) {

        const petalAngle =
            (
                p /
                numPetals
            ) *
            Math.PI *
            2;


        let finalX = cx;

        let finalY = cy;


        for (
            let j = 0;
            j < ringsPerPetal;
            j++
        ) {

            const t =
                j /
                (ringsPerPetal - 1);


            const distance =
                5 +
                t *
                MAX_RADIUS;


            const angleOffset =
                Math.sin(
                    j * 0.018 +
                    p * 1.7
                )
                *
                0.12
                *
                t;


            const angle =
                petalAngle +
                angleOffset;


            const shape =
                Math.sin(
                    t * Math.PI
                );


            const w =
                10 +
                shape * 25;


            const h =
                15 +
                shape * 30;


            let alpha =
                0.28 -
                t * 0.20;


            alpha =
                Math.max(
                    0.025,
                    alpha
                );


            let r =
                30 +
                t * 50;


            let g =
                30 +
                t * 60;


            let b =
                100 +
                t * 80;


            const fade =
                Math.pow(
                    t,
                    2.5
                );


            r =
                r * (1 - fade)
                +
                5 * fade;


            g =
                g * (1 - fade)
                +
                5 * fade;


            b =
                b * (1 - fade)
                +
                5 * fade;


            lilyPetals.push({

                distance,

                angle,

                w,

                h,

                color:
                    `rgba(
                        ${Math.floor(r)},
                        ${Math.floor(g)},
                        ${Math.floor(b)},
                        ${alpha}
                    )`
            });


            finalX =
                cx +
                distance *
                Math.cos(angle);


            finalY =
                cy +
                distance *
                Math.sin(angle);
        }


        /*
           نقطة خروج القطرة
        */

        petalEndPoints.push({

            startX:
                finalX,

            startY:
                finalY,

            angle:
                petalAngle
        });
    }


    lilyPetals.sort(
        (a, b) =>
        a.distance -
        b.distance
    );


    drawQueue =
        drawQueue.concat(
            lilyPetals
        );


    /* =====================================================
       STAMENS
    ===================================================== */

    const stamens = [];


    for (
        let s = 0;
        s < 6;
        s++
    ) {

        const angle =
            (
                s / 6
            ) *
            Math.PI *
            2
            +
            0.2;


        for (
            let j = 0;
            j < 35;
            j++
        ) {

            const dist =
                10 +
                j * 2.2;


            if (
                dist >
                MAX_RADIUS * 0.65
            ) {
                break;
            }


            stamens.push({

                distance:
                    dist,

                angle,

                w: 2,

                h:
                    j < 30
                    ? 4
                    : 12,

                color:
                    j < 30
                    ?
                    `rgba(
                        200,
                        190,
                        230,
                        ${0.25 -
                        (j / 35) *
                        0.15}
                    )`
                    :
                    "rgba(255,255,255,0.3)"
            });
        }
    }


    stamens.sort(
        (a, b) =>
        a.distance -
        b.distance
    );


    drawQueue =
        drawQueue.concat(
            stamens
        );
}


/* =========================================================
   DRAW FLOWER
========================================================= */

function drawItemFromQueue() {

    if (!isDrawingFlower) {
        return;
    }


    if (
        currentIndex >=
        drawQueue.length
    ) {

        isDrawingFlower =
            false;


        /*
           بعد انتهاء الوردة
           نضيف تفاصيل الجذع.
        */

        drawStemDetails();


        setTimeout(
            startBleeding,
            700
        );


        return;
    }


    const item =
        drawQueue[
            currentIndex
        ];


    /* =====================================================
       STEM
    ===================================================== */

    if (
        item.type ===
        "stem"
    ) {

        const previous =
            stemPoints[
                item.idx - 1
            ];


        const current =
            stemPoints[
                item.idx
            ];


        flowerCtx.beginPath();


        flowerCtx.moveTo(
            previous.x,
            previous.y
        );


        flowerCtx.lineTo(
            current.x,
            current.y
        );


        /*
           الجذع الأساسي
        */

        flowerCtx.strokeStyle =
            "rgba(30,45,60,0.95)";


        flowerCtx.lineWidth =
            8;


        flowerCtx.lineCap =
            "round";


        flowerCtx.shadowBlur =
            4;


        flowerCtx.shadowColor =
            "rgba(20,80,120,0.3)";


        flowerCtx.stroke();


        /*
           خط داخلي يعطي الجذع
           تفاصيل وعمق.
        */

        flowerCtx.beginPath();


        flowerCtx.moveTo(
            previous.x - 1.5,
            previous.y
        );


        flowerCtx.lineTo(
            current.x - 1.5,
            current.y
        );


        flowerCtx.strokeStyle =
            "rgba(80,105,120,0.38)";


        flowerCtx.lineWidth =
            2;


        flowerCtx.stroke();
    }


    /* =====================================================
       BASE
    ===================================================== */

    else if (
        item.type ===
        "base"
    ) {

        flowerCtx.save();


        flowerCtx.translate(
            item.x,
            item.y
        );


        flowerCtx.beginPath();


        flowerCtx.ellipse(
            0,
            0,
            item.w,
            item.h,
            0,
            0,
            Math.PI * 2
        );


        flowerCtx.fillStyle =
            item.color;


        flowerCtx.fill();


        flowerCtx.restore();
    }


    /* =====================================================
       PETALS + STAMENS
    ===================================================== */

    else {

        const ring =
            item;


        const x =
            cx +
            ring.distance *
            Math.cos(
                ring.angle
            );


        const y =
            cy +
            ring.distance *
            Math.sin(
                ring.angle
            );


        flowerCtx.save();


        flowerCtx.translate(
            x,
            y
        );


        flowerCtx.rotate(
            ring.angle +
            Math.PI / 2
        );


        flowerCtx.beginPath();


        flowerCtx.ellipse(
            0,
            0,
            ring.w,
            ring.h,
            0,
            0,
            Math.PI * 2
        );


        flowerCtx.strokeStyle =
            ring.color;


        flowerCtx.lineWidth =
            ring.distance < 30
            ? 7
            : 5;


        flowerCtx.shadowBlur =
            10;


        flowerCtx.shadowColor =
            "rgba(30,80,180,0.15)";


        flowerCtx.stroke();


        flowerCtx.restore();
    }


    currentIndex++;


    setTimeout(
        drawItemFromQueue,
        35
    );
}


/* =========================================================
   STEM DETAILS
========================================================= */

function drawStemDetails() {

    /*
       هذا الجزء يجعل الجذع يبدو
       متصلاً بقاعدة الوردة فعلياً.
    */

    const top =
        stemPoints[
            stemPoints.length - 1
        ];


    flowerCtx.save();


    /* اتصال سميك مع قاعدة الزهرة */

    flowerCtx.beginPath();


    flowerCtx.moveTo(
        top.x,
        top.y + 12
    );


    flowerCtx.bezierCurveTo(

        top.x - 12,
        top.y + 2,

        cx - 28,
        cy + 100,

        cx,
        cy + 72
    );


    flowerCtx.strokeStyle =
        "rgba(38,55,75,0.9)";


    flowerCtx.lineWidth =
        13;


    flowerCtx.lineCap =
        "round";


    flowerCtx.shadowBlur =
        8;


    flowerCtx.shadowColor =
        "rgba(20,70,130,0.3)";


    flowerCtx.stroke();


    /*
       عروق طولية
    */

    flowerCtx.beginPath();


    for (
        let i = 20;
        i < stemPoints.length - 5;
        i += 8
    ) {

        const p =
            stemPoints[i];


        const next =
            stemPoints[i + 3];


        flowerCtx.moveTo(
            p.x + 2,
            p.y
        );


        flowerCtx.lineTo(
            next.x + 2,
            next.y
        );
    }


    flowerCtx.strokeStyle =
        "rgba(100,120,135,0.22)";


    flowerCtx.lineWidth =
        1.4;


    flowerCtx.stroke();


    /*
       أوراق صغيرة على الجذع
    */

    drawLeaf(
        cx - 28,
        cy + 185,
        -0.65,
        58,
        24
    );


    drawLeaf(
        cx + 12,
        cy + 270,
        0.48,
        52,
        21
    );


    flowerCtx.restore();
}


/* =========================================================
   LEAF
========================================================= */

function drawLeaf(
    x,
    y,
    angle,
    length,
    width
) {

    flowerCtx.save();


    flowerCtx.translate(
        x,
        y
    );


    flowerCtx.rotate(
        angle
    );


    flowerCtx.beginPath();


    flowerCtx.moveTo(
        0,
        0
    );


    flowerCtx.quadraticCurveTo(
        length * 0.45,
        -width,
        length,
        0
    );


    flowerCtx.quadraticCurveTo(
        length * 0.45,
        width,
        0,
        0
    );


    const gradient =
        flowerCtx.createLinearGradient(
            0,
            -width,
            length,
            width
        );


    gradient.addColorStop(
        0,
        "rgba(18,35,48,0.95)"
    );


    gradient.addColorStop(
        0.5,
        "rgba(28,55,65,0.8)"
    );


    gradient.addColorStop(
        1,
        "rgba(8,20,28,0.95)"
    );


    flowerCtx.fillStyle =
        gradient;


    flowerCtx.fill();


    /*
       عرق الورقة
    */

    flowerCtx.beginPath();


    flowerCtx.moveTo(
        0,
        0
    );


    flowerCtx.lineTo(
        length,
        0
    );


    flowerCtx.strokeStyle =
        "rgba(100,130,140,0.35)";


    flowerCtx.lineWidth =
        1.5;


    flowerCtx.stroke();


    /*
       عروق جانبية
    */

    for (
        let i = 0.2;
        i < 0.9;
        i += 0.16
    ) {

        const px =
            length * i;


        const h =
            width *
            Math.sin(
                i * Math.PI
            );


        flowerCtx.beginPath();


        flowerCtx.moveTo(
            px,
            0
        );


        flowerCtx.lineTo(
            px - 8,
            -h
        );


        flowerCtx.strokeStyle =
            "rgba(90,120,130,0.18)";


        flowerCtx.lineWidth =
            1;


        flowerCtx.stroke();


        flowerCtx.beginPath();


        flowerCtx.moveTo(
            px,
            0
        );


        flowerCtx.lineTo(
            px - 8,
            h
        );


        flowerCtx.stroke();
    }


    flowerCtx.restore();
}


/* =========================================================
   CREATE TARGETS FOR TEXT
========================================================= */

function createTextTargets() {

    const offscreen =
        document.createElement(
            "canvas"
        );


    const targetCtx =
        offscreen.getContext(
            "2d"
        );


    /*
       حجم النص
       أصغر قليلاً على الهاتف
    */

    const fontSize =
        Math.min(
            48,
            W * 0.105
        );


    offscreen.width =
        W;


    offscreen.height =
        H;


    targetCtx.clearRect(
        0,
        0,
        W,
        H
    );


    targetCtx.font =
        `bold ${fontSize}px
        'Brush Script MT',
        'Great Vibes',
        cursive`;


    targetCtx.textAlign =
        "center";


    targetCtx.textBaseline =
        "middle";


    /*
       موقع الجملة
       تحت الوردة
    */

    const textY =
        cy + 270;


    targetCtx.fillStyle =
        "white";


    targetCtx.fillText(
        "I love u samo",
        cx,
        textY
    );


    const image =
        targetCtx.getImageData(
            0,
            0,
            W,
            H
        );


    const targets = [];


    /*
       المسافة بين القطرات
    */

    const spacing =
        Math.max(
            5,
            Math.floor(
                W / 90
            )
        );


    for (
        let y = 0;
        y < H;
        y += spacing
    ) {

        for (
            let x = 0;
            x < W;
            x += spacing
        ) {

            const index =
                (
                    y * W +
                    x
                ) * 4;


            if (
                image.data[index + 3]
                >
                100
            ) {

                targets.push({
                    x,
                    y
                });
            }
        }
    }


    /*
       خلط بسيط للترتيب
       حتى تصل القطرات بشكل طبيعي
    */

    for (
        let i = targets.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            targets[i],
            targets[j]
        ] =
        [
            targets[j],
            targets[i]
        ];
    }


    return targets;
}


/* =========================================================
   START BLEEDING
========================================================= */

function startBleeding() {

    isBleeding =
        true;


    /*
       تنظيف طبقة الدم فقط.
    */

    bloodCtx.clearRect(
        0,
        0,
        W,
        H
    );


    const targets =
        createTextTargets();


    drops = [];


    /*
       نحتاج عدداً كبيراً من القطرات
       لتكوين العبارة.
    */

    const amount =
        Math.min(
            targets.length,
            650
        );


    /*
       نقاط الانطلاق من أطراف البتلات.
    */

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const source =
            petalEndPoints[
                i %
                petalEndPoints.length
            ];


        const target =
            targets[i];


        drops.push({

            startX:
                source.startX +
                (
                    Math.random() -
                    0.5
                ) * 10,

            startY:
                source.startY +
                (
                    Math.random() -
                    0.5
                ) * 10,


            x:
                source.startX,

            y:
                source.startY,


            targetX:
                target.x,

            targetY:
                target.y,


            progress:
                -i * 0.012,


            speed:
                0.0035 +
                Math.random() *
                0.0025,


            size:
                1.2 +
                Math.random() *
                1.6,


            arrived:
                false
        });
    }


    requestAnimationFrame(
        animateBlood
    );
}


/* =========================================================
   BLOOD DROPS ANIMATION
========================================================= */

function animateBlood() {

    if (!isBleeding) {
        return;
    }


    /*
       نمسح الدم فقط.

       الوردة والجذع لن يتأثرا.
    */

    bloodCtx.clearRect(
        0,
        0,
        W,
        H
    );


    let allArrived =
        true;


    for (
        const drop of drops
    ) {

        /*
           تأخير خروج القطرات
        */

        drop.progress +=
            drop.speed;


        if (
            drop.progress < 0
        ) {

            allArrived =
                false;

            continue;
        }


        if (
            drop.progress < 1
        ) {

            allArrived =
                false;
        }


        /*
           حركة ناعمة
        */

        const p =
            Math.min(
                drop.progress,
                1
            );


        const eased =
            1 -
            Math.pow(
                1 - p,
                3
            );


        drop.x =
            drop.startX +
            (
                drop.targetX -
                drop.startX
            ) *
            eased;


        drop.y =
            drop.startY +
            (
                drop.targetY -
                drop.startY
            ) *
            eased;


        /*
           القطرة
        */

        bloodCtx.save();


        bloodCtx.shadowBlur =
            12;


        bloodCtx.shadowColor =
            "rgba(40,120,255,0.8)";


        bloodCtx.fillStyle =
            "rgba(45,145,255,0.9)";


        bloodCtx.beginPath();


        bloodCtx.arc(
            drop.x,
            drop.y,
            drop.size,
            0,
            Math.PI * 2
        );


        bloodCtx.fill();


        bloodCtx.restore();
    }


    /*
       عندما تصل كل القطرات
       تصبح العبارة ثابتة.
    */

    if (
        allArrived
    ) {

        isBleeding =
            false;


        /*
           إضافة لمعان بسيط للقطرات
        */

        animateFinalGlow();


        return;
    }


    requestAnimationFrame(
        animateBlood
    );
}


/* =========================================================
   FINAL GLOW
========================================================= */

function animateFinalGlow() {

    let phase = 0;


    function glow() {

        /*
           لا نمسح الجملة.
           نضيف فقط لمعاناً خفيفاً.
        */

        phase += 0.04;


        bloodCtx.save();


        bloodCtx.globalCompositeOperation =
            "lighter";


        bloodCtx.globalAlpha =
            0.08 +
            Math.sin(phase) *
            0.04;


        bloodCtx.filter =
            "blur(3px)";


        bloodCtx.drawImage(
            bloodCanvas,
            0,
            0,
            W,
            H
        );


        bloodCtx.restore();


        requestAnimationFrame(
            glow
        );
    }


    glow();
}


/* =========================================================
   START
========================================================= */

resizeCanvas();


flowerCtx.fillStyle =
"#05020a";


flowerCtx.fillRect(
    0,
    0,
    W,
    H
);


setTimeout(
    drawItemFromQueue,
    600
);

</script>

</body>
</html>
