<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الزنبقة الزرقاء الغامضة - نسخة متصلة ومثالية</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #04020a; /* خلفية بنفسجية-سوداء عميقة */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
            background-color: #04020a;
        }
    </style>
</head>
<body>
    <canvas id="flowerCanvas"></canvas>

    <script>
        const canvas = document.getElementById('flowerCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        let drawQueue = [];
        let currentIndex = 0;

        // حساب الحجم الآمن للزهرة لتجنب الخروج عن الشاشة والتشوه
        const MAX_RADIUS = Math.min(canvas.width, canvas.height) * 0.35; 

        // -----------------------------------------
        // 1. توليد الساق المتصلة (Stem)
        // -----------------------------------------
        function generateStemPoints() {
            const points = [];
            const steps = 120;
            // نقطة البداية (أسفل الساق، خارج المركز قليلاً)
            const startY = cy + 350; 
            const startX = cx + 20; 
            
            for (let i = 0; i <= steps; i++) {
                let t = i / steps;
                // الساق ينحني بلطف ويتجه للأعلى
                let x = startX - (t * 22); 
                let y = startY - (t * (350 - 130)); // ينتهي عند cy + 130 بالضبط
                points.push({x, y});
            }
            return points;
        }

        const stemPoints = generateStemPoints();
        // إضافة نقاط الساق من الأسفل للأعلى
        for (let i = 0; i < stemPoints.length; i++) {
            drawQueue.push({ type: 'stem', idx: i });
        }

        // -----------------------------------------
        // 2. قاعدة الزهرة (القمع / Receptacle) - للربط بين الساق والبتلات
        // -----------------------------------------
        function generateReceptacle() {
            const loops = [];
            for (let i = 0; i < 80; i++) {
                let t = i / 80;
                // قاعدة تبدأ من cy + 130 وتصعد قليلاً إلى cy + 90
                let yOffset = 130 - (t * 40); 
                let xOffset = -15 + (t * 30);
                // حلقات بيضاوية تتجمع لتشكل الوعاء
                let w = 15 + t * 25;
                let h = 10 + t * 15;
                let color = `rgba(25, 30, 55, ${0.5 - t * 0.2})`;
                loops.push({ type: 'base', x: cx + xOffset, y: cy + yOffset, w, h, angle: 0, color });
            }
            return loops;
        }
        drawQueue = drawQueue.concat(generateReceptacle());

        // -----------------------------------------
        // 3. بتلات الزنبقة (Lily Petals) - باستخدام دالة جيب لإنشاء أطراف مدببة
        // -----------------------------------------
        const lilyPetals = [];
        const numPetals = 6;
        const ringsPerPetal = 120;

        for (let p = 0; p < numPetals; p++) {
            let petalAngle = (p / numPetals) * 2 * Math.PI;
            for (let j = 0; j < ringsPerPetal; j++) {
                let t = j / ringsPerPetal;
                
                // توقف الزهرة بالضبط عند MAX_RADIUS ولا تتجاوزه أبداً
                let distance = 5 + (t * MAX_RADIUS);
                if (distance > MAX_RADIUS) break; 
                
                let angleOffset = Math.sin(j * 0.02) * 0.3; 
                let angle = petalAngle + angleOffset;
                
                // *** معادلة الشكل المدبب (الجمالية) ***
                // تستخدم دالة الجيب لتعطي شكل بتلة حقيقية: رفيعة في البداية، عريضة في المنتصف، ومدببة في النهاية
                let shapeFactor = Math.sin(t * Math.PI); 
                
                let w = 10 + shapeFactor * 25; // العرض
                let h = 15 + shapeFactor * 30; // الطول
                
                // تدرج الألوان الزرقاء الباهتة
                let alpha = 0.35 - (t * 0.25);
                alpha = Math.max(0.03, alpha);
                let r = 30 + t * 80;
                let g = 40 + t * 100;
                let b = 120 + t * 110;
                
                let color = `rgba(${r}, ${g}, ${b}, ${alpha})`;
                
                lilyPetals.push({ distance, angle, w, h, color });
            }
        }
        // ترتيب البتلات من الداخل إلى الخارج
        lilyPetals.sort((a, b) => a.distance - b.distance);
        drawQueue = drawQueue.concat(lilyPetals);

        // -----------------------------------------
        // 4. الأسدية (Stamens) - عناصر داخلية جمالية
        // -----------------------------------------
        const stamens = [];
        for (let s = 0; s < 6; s++) {
            let stamenAngle = (s / 6) * 2 * Math.PI + 0.2;
            for (let j = 0; j < 35; j++) {
                let dist = 10 + j * 2.2;
                if (dist > MAX_RADIUS * 0.65) break; // الأسدية أقصر من البتلات
                let color = j < 30 ? 
                    `rgba(110, 90, 130, ${0.3 - (j/35)*0.2})` : 
                    `rgba(200, 180, 210, 0.4)`; // رأس السداة باهت
                stamens.push({ distance: dist, angle: stamenAngle, w: 2, h: j < 30 ? 4 : 12, color });
            }
        }
        stamens.sort((a, b) => a.distance - b.distance);
        drawQueue = drawQueue.concat(stamens);

        // -----------------------------------------
        // 5. إعدادات الرسم البطيء جداً
        // -----------------------------------------
        ctx.lineWidth = 3.5;
        ctx.shadowBlur = 18; 
        ctx.shadowColor = 'rgba(50, 30, 80, 0.25)'; // ظل بنفسجي غامض لطابع قديم

        const DRAW_DELAY_MS = 55; // بطيء جداً لملاحظة التشكل

        function drawItemFromQueue() {
            if (currentIndex >= drawQueue.length) return;

            const item = drawQueue[currentIndex];

            if (item.type === 'stem') {
                // رسم الساق كخطوط متصلة تنمو للأعلى
                ctx.beginPath();
                ctx.moveTo(stemPoints[Math.max(0, item.idx - 1)].x, stemPoints[Math.max(0, item.idx - 1)].y);
                ctx.lineTo(stemPoints[item.idx].x, stemPoints[item.idx].y);
                ctx.strokeStyle = 'rgba(35, 45, 60, 0.7)';
                ctx.lineWidth = 6.5;
                ctx.shadowBlur = 0; // الساق لا يحتاج توهج كثيف
                ctx.stroke();
                ctx.shadowBlur = 18;
            } 
            else if (item.type === 'base') {
                // رسم القمع (حلقات مملوءة)
                ctx.save();
                ctx.translate(item.x, item.y);
                ctx.beginPath();
                ctx.ellipse(0, 0, item.w, item.h, 0, 0, Math.PI * 2);
                ctx.fillStyle = item.color;
                ctx.fill();
                ctx.restore();
            } 
            else {
                // رسم البتلات والأسدية (حلقات مجوفة باهتة)
                const ring = item;
                const x = cx + ring.distance * Math.cos(ring.angle);
                const y = cy + ring.distance * Math.sin(ring.angle);
                
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(ring.angle + Math.PI / 2);
                
                ctx.beginPath();
                ctx.ellipse(0, 0, ring.w, ring.h, 0, 0, Math.PI * 2);
                ctx.strokeStyle = ring.color;
                ctx.lineWidth = ring.distance < 30 ? 5 : 3.5; // سمك أعرض في المركز
                ctx.stroke();
                
                ctx.restore();
            }

            currentIndex++;
            setTimeout(drawItemFromQueue, DRAW_DELAY_MS);
        }

        // رسم الخلفية وبدء الأنيميشن
        ctx.fillStyle = '#04020a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        setTimeout(drawItemFromQueue, 600); // تأخير ثانية قبل البدء

    </script>
</body>
</html>
