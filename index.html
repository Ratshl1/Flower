<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>زهرة الحلقات الباهتة</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0f0211; /* خلفية داكنة جدا */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
            background-color: #0f0211;
        }
    </style>
</head>
<body>
    <canvas id="flowerCanvas"></canvas>

    <script>
        const canvas = document.getElementById('flowerCanvas');
        const ctx = canvas.getContext('2d');

        // ضبط حجم اللوحة لملء الشاشة
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // نقطة مركز الرسم
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        // *** توليد البيانات الحلقية (الحلقات المتماسكة) ***
        const ringsData = [];
        const numPetals = 6; // عدد البتلات (مثل الصورة)
        const ringsPerPetal = 70; // كثافة الحلقات

        // توليد الحلقات التي تشكل بتلات الزهرة
        for (let p = 0; p < numPetals; p++) {
            let petalAngle = (p / numPetals) * 2 * Math.PI;
            for (let j = 0; j < ringsPerPetal; j++) {
                let distance = 5 + j * 2.4; // المسافة من المركز
                let angle = petalAngle + (j * 0.04); // انحراف بسيط لتعطي التواء جميل
                
                // أبعاد الحلقة البيضاوية
                let w = 12 + j * 0.1; // العرض
                let h = 22 + j * 0.7; // الارتفاع (تأخذ شكل البتلة)
                
                // التحكم باللون الباهت "فايدة الألوان" (Alpha)
                // المركز شديد السطوع، والأطراف باهتة
                let alpha = 0.35 - (j / ringsPerPetal) * 0.25;
                let color = `rgba(255, ${80 + j * 2}, 180, ${alpha < 0 ? 0.05 : alpha})`;
                
                ringsData.push({ distance, angle, w, h, color });
            }
        }

        // إضافة حلقات المركز الكثيفة لجعل الزهرة نابضة بالحياة
        for (let i = 0; i < 150; i++) {
            let dist = Math.random() * 18;
            let angle = Math.random() * 2 * Math.PI;
            let w = 8 + Math.random() * 12;
            let h = 8 + Math.random() * 12;
            ringsData.push({ 
                distance: dist, 
                angle: angle, 
                w: w, 
                h: h, 
                color: `rgba(255, ${200 + Math.floor(Math.random()*55)}, 240, ${0.3 + Math.random() * 0.4})` 
            });
        }

        // *** ترتيب الرسم من الداخل إلى الخارج بشكل منظم ***
        ringsData.sort((a, b) => a.distance - b.distance);

        // *** رسم الساق والورقة ***
        function drawStemAndLeaf() {
            // الساق
            ctx.beginPath();
            ctx.moveTo(cx - 5, cy + 90);
            ctx.quadraticCurveTo(cx - 25, cy + 180, cx + 20, cy + 300);
            ctx.strokeStyle = 'rgba(60, 140, 90, 0.8)';
            ctx.lineWidth = 4;
            ctx.stroke();

            // الورقة
            ctx.save();
            ctx.translate(cx - 8, cy + 190);
            ctx.rotate(0.3);
            ctx.beginPath();
            ctx.ellipse(0, 0, 20, 10, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(60, 140, 90, 0.7)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(60, 140, 90, 0.7)';
            ctx.stroke();
            ctx.restore();
        }

        // رسم الخلفية والساق فوراً
        ctx.fillStyle = '#0f0211';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        drawStemAndLeaf();

        // *** إعدادات الجمالية (التمويه والبهتان) ***
        ctx.lineWidth = 2.5;
        ctx.shadowBlur = 8; // تأثير التوهج الناعم
        ctx.shadowColor = 'rgba(255, 105, 180, 0.4)';

        // *** نظام الرسوم المتحركة البطيء ***
        let currentRingIndex = 0;

        function drawNextRing() {
            if (currentRingIndex < ringsData.length) {
                const ring = ringsData[currentRingIndex];
                
                // حساب الإحداثيات القطبية
                const x = cx + ring.distance * Math.cos(ring.angle);
                const y = cy + ring.distance * Math.sin(ring.angle);
                
                // رسم الحلقة
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(ring.angle + Math.PI / 2); // تدوير الحلقة
                
                ctx.beginPath();
                ctx.ellipse(0, 0, ring.w, ring.h, 0, 0, Math.PI * 2);
                ctx.strokeStyle = ring.color;
                ctx.stroke();
                
                ctx.restore();

                currentRingIndex++;
                requestAnimationFrame(drawNextRing); // استمرار الرسم
            }
        }

        // إرجاع الرسم المتأخر قليلاً (قسم بالثانية) ليكون بطيئاً أكثر
        setTimeout(() => {
            drawNextRing();
        }, 100);

        // إعادة ضبط الحجم عند تغيير حجم النافذة
        window.addEventListener('resize', () => {
            // ملاحظة: إعادة الضبط ستفرض عليك تحديث الصفحة للحصول على المركز الصحيح
            // للحصول على تجربة مثالية، أبقي النافذة بحجمها الطبيعي.
        });
    </script>
</body>
</html>
