<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الزنبقة الزرقاء - رسالة نيون</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #05020a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            touch-action: none;
        }
        canvas {
            display: block;
            background-color: #05020a;
        }
    </style>
</head>
<body>
    <canvas id="flowerCanvas"></canvas>

    <script>
        const canvas = document.getElementById('flowerCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        let drawQueue = [];
        let currentIndex = 0;
        let petalEndPoints = [];

        let isDrawingFlower = true;
        let isBleeding = false;

        const MAX_RADIUS = Math.min(canvas.width, canvas.height) * 0.35; 
        const CENTER_GAP = 130; 

        // -----------------------------------------
        // 1. توليد الساق المتصلة
        // -----------------------------------------
        function generateStemPoints() {
            const points = [];
            const steps = 120;
            const startY = cy + 350; 
            const startX = cx + 20; 
            for (let i = 0; i <= steps; i++) {
                let t = i / steps;
                let x = startX - (t * 22); 
                let y = startY - (t * (350 - CENTER_GAP)); 
                points.push({x, y});
            }
            return points;
        }

        const stemPoints = generateStemPoints();
        for (let i = 0; i < stemPoints.length; i++) {
            drawQueue.push({ type: 'stem', idx: i });
        }

        // -----------------------------------------
        // 2. قاعدة الزهرة (القمع)
        // -----------------------------------------
        function generateReceptacle() {
            const loops = [];
            for (let i = 0; i < 80; i++) {
                let t = i / 80;
                let yOffset = CENTER_GAP - (t * 40); 
                let xOffset = -15 + (t * 30);
                let w = 15 + t * 25;
                let h = 10 + t * 15;
                let color = `rgba(20, 25, 45, ${0.4 - t * 0.15})`;
                loops.push({ type: 'base', x: cx + xOffset, y: cy + yOffset, w, h, angle: 0, color });
            }
            return loops;
        }
        drawQueue = drawQueue.concat(generateReceptacle());

        // -----------------------------------------
        // 3. بتلات الزهرة (ألوان زرقاء وأطراف سوداء)
        // -----------------------------------------
        const lilyPetals = [];
        const numPetals = 6;
        const ringsPerPetal = 120;

        for (let p = 0; p < numPetals; p++) {
            let petalAngle = (p / numPetals) * 2 * Math.PI;
            for (let j = 0; j < ringsPerPetal; j++) {
                let t = j / ringsPerPetal;
                let distance = 5 + (t * MAX_RADIUS);
                if (distance > MAX_RADIUS) break; 
                let angleOffset = Math.sin(j * 0.02) * 0.3; 
                let angle = petalAngle + angleOffset;
                
                let shapeFactor = Math.sin(t * Math.PI); 
                let w = 10 + shapeFactor * 25; 
                let h = 15 + shapeFactor * 30; 
                
                let alpha = 0.25 - (t * 0.20); 
                alpha = Math.max(0.02, alpha);
                
                let r = 30 + t * 50;
                let g = 30 + t * 60;
                let b = 100 + t * 80;
                
                let fadeToBlack = Math.pow(t, 2.5);
                r = r * (1 - fadeToBlack) + 5 * fadeToBlack;
                g = g * (1 - fadeToBlack) + 5 * fadeToBlack;
                b = b * (1 - fadeToBlack) + 5 * fadeToBlack;
                
                let color = `rgba(${Math.floor(r)}, ${Math.floor(g)}, ${Math.floor(b)}, ${alpha})`;
                lilyPetals.push({ distance, angle, w, h, color });

                // **تخزين الطرف الخارجي للبتلة (لنزول الدم) - تم تعديله ليتوافق مع كود المستخدم**
                if (j === ringsPerPetal - 1) {
                    let endX = cx + distance * Math.cos(angle);
                    let endY = cy + distance * Math.sin(angle);
                    petalEndPoints.push({ 
                        startX: endX, 
                        startY: endY + 10, 
                        angle: petalAngle 
                    });
                }
            }
        }
        lilyPetals.sort((a, b) => a.distance - b.distance);
        drawQueue = drawQueue.concat(lilyPetals);

        // -----------------------------------------
        // 4. الأسدية البيضاء (فوق الأزرق)
        // -----------------------------------------
        const stamens = [];
        for (let s = 0; s < 6; s++) {
            let stamenAngle = (s / 6) * 2 * Math.PI + 0.2;
            for (let j = 0; j < 35; j++) {
                let dist = 10 + j * 2.2;
                if (dist > MAX_RADIUS * 0.65) break;
                let color = j < 30 ? 
                    `rgba(200, 190, 230, ${0.25 - (j/35)*0.15})` : 
                    `rgba(255, 255, 255, 0.3)`;
                stamens.push({ distance: dist, angle: stamenAngle, w: 2, h: j < 30 ? 4 : 12, color });
            }
        }
        stamens.sort((a, b) => a.distance - b.distance);
        drawQueue = drawQueue.concat(stamens);

        // -----------------------------------------
        // 5. إعدادات الرسم البطيء للزهرة (باستخدام setTimeout)
        // -----------------------------------------
        ctx.lineWidth = 5.5;
        ctx.shadowBlur = 12; 
        ctx.shadowColor = 'rgba(30, 20, 60, 0.2)'; 

        const DRAW_DELAY_MS = 55;

        ctx.fillStyle = '#05020a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // ============================================
        // مرحلة النزيف - كود المستخدم (قطرات مع requestAnimationFrame)
        // ============================================
        let bleedingDrops = [];
        let bleedAnimationStart = 0;

        function startBleeding() {
            isDrawingFlower = false;
            isBleeding = true;
            // تجهيز قطرات مستقلة لكل بتلة
            bleedingDrops = petalEndPoints.map((end, index) => {
                return {
                    startX: end.startX,
                    startY: end.startY,
                    // كل قطرة لها سرعة ومسار مختلف قليلاً
                    x: end.startX,
                    y: end.startY,
                    speed: 1.8 + Math.random() * 0.8,
                    // الميل باتجاه الأسفل مع انحراف بسيط
                    drift: (Math.random() - 0.5) * 0.35,
                    length: 0,
                    maxLength: 130 + Math.random() * 90,
                    size: 3.5 + Math.random() * 2.5,
                    finished: false
                };
            });
            bleedAnimationStart = performance.now();
            requestAnimationFrame(animateBleeding);
        }

        function animateBleeding(timestamp) {
            if (!isBleeding) return;
            // الزمن منذ بداية النزيف
            const elapsed = timestamp - bleedAnimationStart;
            ctx.save();
            // توهج خفيف فقط
            ctx.shadowBlur = 14;
            ctx.shadowColor = 'rgba(40, 130, 255, 0.65)';
            let allFinished = true;
            for (let i = 0; i < bleedingDrops.length; i++) {
                const drop = bleedingDrops[i];
                if (drop.finished) continue;
                allFinished = false;
                // تأخير بسيط بين كل قطرة وأخرى
                const delay = i * 120;
                if (elapsed < delay) {
                    continue;
                }
                const localTime = elapsed - delay;
                // مقدار النزول
                drop.length = localTime * 0.075 * drop.speed;
                if (drop.length >= drop.maxLength) {
                    drop.length = drop.maxLength;
                    drop.finished = true;
                }
                // الحركة من رأس البتلة إلى الأسفل
                drop.x =
                    drop.startX +
                    Math.sin(drop.length * 0.025 + i) * 8 +
                    drop.drift * drop.length;
                drop.y = drop.startY + drop.length;
                // -------------------------------
                // رسم مجرى الدم خلف القطرة
                // -------------------------------
                const trailLength = Math.min(drop.length, 65);
                const gradient = ctx.createLinearGradient(
                    drop.x,
                    drop.y - trailLength,
                    drop.x,
                    drop.y
                );
                gradient.addColorStop(
                    0,
                    'rgba(30, 110, 255, 0)'
                );
                gradient.addColorStop(
                    0.45,
                    'rgba(40, 130, 255, 0.35)'
                );
                gradient.addColorStop(
                    1,
                    'rgba(45, 145, 255, 0.8)'
                );
                ctx.beginPath();
                ctx.moveTo(
                    drop.x,
                    drop.y - trailLength
                );
                ctx.lineTo(
                    drop.x,
                    drop.y
                );
                ctx.strokeStyle = gradient;
                ctx.lineWidth = drop.size * 0.8;
                ctx.lineCap = 'round';
                ctx.stroke();
                // -------------------------------
                // رسم القطرة نفسها
                // -------------------------------
                ctx.beginPath();
                ctx.ellipse(
                    drop.x,
                    drop.y,
                    drop.size,
                    drop.size * 1.7,
                    0,
                    0,
                    Math.PI * 2
                );
                ctx.fillStyle = 'rgba(40, 145, 255, 0.95)';
                ctx.fill();
            }
            ctx.restore();
            // عندما تنتهي كل القطرات
            if (allFinished) {
                isBleeding = false;
                // انتظار بسيط قبل ظهور الجملة
                setTimeout(showLoveText, 700);
                return;
            }
            requestAnimationFrame(animateBleeding);
        }

        // ============================================
        // مرحلة الجملة - كتابة مرة واحدة (بدون تداخل)
        // ============================================
        function showLoveText() {
            const text = "I love u samo";
            const yPos = cy + 160;
            ctx.font =
                "bold 48px 'Brush Script MT', 'Great Vibes', 'Comic Sans MS', cursive, sans-serif";
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            // -----------------------------------------
            // نستخدم Canvas منفصل للنص
            // حتى لا تتراكم الحروف فوق بعضها
            // -----------------------------------------
            const textCanvas = document.createElement('canvas');
            textCanvas.width = canvas.width;
            textCanvas.height = canvas.height;
            const textCtx = textCanvas.getContext('2d');
            textCtx.font = ctx.font;
            textCtx.textAlign = 'center';
            textCtx.textBaseline = 'middle';
            let step = 0;
            const textInterval = setInterval(() => {
                // تنظيف منطقة النص فقط
                textCtx.clearRect(
                    0,
                    yPos - 70,
                    canvas.width,
                    140
                );
                const partialText = text.substring(0, step);
                // -------------------------------
                // الظل الخلفي
                // -------------------------------
                textCtx.shadowBlur = 0;
                textCtx.fillStyle = '#101025';
                textCtx.fillText(
                    partialText,
                    cx - 2,
                    yPos + 2
                );
                // -------------------------------
                // النص الأزرق النيون
                // -------------------------------
                textCtx.shadowBlur = 18;
                textCtx.shadowColor = '#3399ff';
                textCtx.fillStyle = '#3399ff';
                textCtx.fillText(
                    partialText,
                    cx,
                    yPos
                );
                // -------------------------------
                // رسم الـCanvas الخاص بالنص
                // فوق الـCanvas الأساسي
                // -------------------------------
                ctx.clearRect(
                    0,
                    yPos - 70,
                    canvas.width,
                    140
                );
                ctx.drawImage(
                    textCanvas,
                    0,
                    0
                );
                step++;
                // إيقاف الكتابة بعد اكتمال الجملة
                if (step > text.length) {
                    clearInterval(textInterval);
                    // إبقاء الجملة كما هي
                    ctx.clearRect(
                        0,
                        yPos - 70,
                        canvas.width,
                        140
                    );
                    ctx.drawImage(
                        textCanvas,
                        0,
                        0
                    );
                }
            }, 150);
        }

        // ============================================
        // حلقة الرسم الرئيسية (الزهرة تستخدم setTimeout)
        // ============================================
        function drawItemFromQueue() {
            if (!isDrawingFlower) return;

            if (currentIndex >= drawQueue.length) {
                isDrawingFlower = false;
                // تبديل مرحلة الرسم إلى النزيف
                setTimeout(startBleeding, 500);
                return;
            }

            const item = drawQueue[currentIndex];

            if (item.type === 'stem') {
                ctx.beginPath();
                ctx.moveTo(stemPoints[Math.max(0, item.idx - 1)].x, stemPoints[Math.max(0, item.idx - 1)].y);
                ctx.lineTo(stemPoints[item.idx].x, stemPoints[item.idx].y);
                ctx.strokeStyle = 'rgba(35, 45, 60, 0.7)';
                ctx.lineWidth = 6.5;
                ctx.shadowBlur = 0;
                ctx.stroke();
                ctx.shadowBlur = 12;
            } 
            else if (item.type === 'base') {
                ctx.save();
                ctx.translate(item.x, item.y);
                ctx.beginPath();
                ctx.ellipse(0, 0, item.w, item.h, 0, 0, Math.PI * 2);
                ctx.fillStyle = item.color;
                ctx.fill();
                ctx.restore();
            } 
            else {
                const ring = item;
                const x = cx + ring.distance * Math.cos(ring.angle);
                const y = cy + ring.distance * Math.sin(ring.angle);
                
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(ring.angle + Math.PI / 2);
                
                ctx.beginPath();
                ctx.ellipse(0, 0, ring.w, ring.h, 0, 0, Math.PI * 2);
                ctx.strokeStyle = ring.color;
                ctx.lineWidth = ring.distance < 30 ? 7 : 5;
                ctx.stroke();
                
                ctx.restore();
            }

            currentIndex++;
            setTimeout(drawItemFromQueue, DRAW_DELAY_MS);
        }

        // بدء الرسم
        setTimeout(drawItemFromQueue, 600);

        window.addEventListener('resize', () => {
            // لأفضل تجربة يرجى تحديث الصفحة عند تغيير الحجم.
        });

    </script>
</body>
</html>
