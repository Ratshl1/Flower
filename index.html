<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الزنبقة الزرقاء ودم الحب</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #04020a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
            background-color: #04020a;
        }
    </style>
</head>
<body>
    <canvas id="flowerCanvas"></canvas>

    <script>
        const canvas = document.getElementById('flowerCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        let drawQueue = [];
        let currentIndex = 0;
        let petalEndPoints = []; // نقاط أطراف البتلات

        // متغيرات مراحل الرسم
        let isDrawingFlower = true;
        let isBleeding = false;
        let bleedStep = 0;

        // الحجم الآمن للزهرة
        const MAX_RADIUS = Math.min(canvas.width, canvas.height) * 0.35; 
        const CENTER_GAP = 130; 

        // -----------------------------------------
        // 1. توليد الساق المتصلة
        // -----------------------------------------
        function generateStemPoints() {
            const points = [];
            const steps = 120;
            const startY = cy + 350; 
            const startX = cx + 20; 
            for (let i = 0; i <= steps; i++) {
                let t = i / steps;
                let x = startX - (t * 22); 
                let y = startY - (t * (350 - CENTER_GAP)); 
                points.push({x, y});
            }
            return points;
        }

        const stemPoints = generateStemPoints();
        for (let i = 0; i < stemPoints.length; i++) {
            drawQueue.push({ type: 'stem', idx: i });
        }

        // -----------------------------------------
        // 2. قاعدة الزهرة (القمع)
        // -----------------------------------------
        function generateReceptacle() {
            const loops = [];
            for (let i = 0; i < 80; i++) {
                let t = i / 80;
                let yOffset = CENTER_GAP - (t * 40); 
                let xOffset = -15 + (t * 30);
                let w = 15 + t * 25;
                let h = 10 + t * 15;
                let color = `rgba(20, 25, 45, ${0.4 - t * 0.15})`;
                loops.push({ type: 'base', x: cx + xOffset, y: cy + yOffset, w, h, angle: 0, color });
            }
            return loops;
        }
        drawQueue = drawQueue.concat(generateReceptacle());

        // -----------------------------------------
        // 3. بتلات الزهرة الزرقاء (تأتي أولاً)
        // -----------------------------------------
        const lilyPetals = [];
        const numPetals = 6;
        const ringsPerPetal = 120;

        for (let p = 0; p < numPetals; p++) {
            let petalAngle = (p / numPetals) * 2 * Math.PI;
            for (let j = 0; j < ringsPerPetal; j++) {
                let t = j / ringsPerPetal;
                let distance = 5 + (t * MAX_RADIUS);
                if (distance > MAX_RADIUS) break; 
                let angleOffset = Math.sin(j * 0.02) * 0.3; 
                let angle = petalAngle + angleOffset;
                
                let shapeFactor = Math.sin(t * Math.PI); 
                let w = 10 + shapeFactor * 25; 
                let h = 15 + shapeFactor * 30; 
                
                let alpha = 0.25 - (t * 0.20); 
                alpha = Math.max(0.02, alpha);
                
                let r = 30 + t * 50;
                let g = 30 + t * 60;
                let b = 100 + t * 80;
                
                // تحويل الألوان إلى الأسود عند الأطراف
                let fadeToBlack = Math.pow(t, 2.5);
                r = r * (1 - fadeToBlack) + 5 * fadeToBlack;
                g = g * (1 - fadeToBlack) + 5 * fadeToBlack;
                b = b * (1 - fadeToBlack) + 5 * fadeToBlack;
                
                let color = `rgba(${Math.floor(r)}, ${Math.floor(g)}, ${Math.floor(b)}, ${alpha})`;
                lilyPetals.push({ distance, angle, w, h, color });

                // تخزين نقطة نهاية كل بتلة للنزيف (آخر حلقة في البتلة)
                if (j === ringsPerPetal - 1) {
                    let endX = cx + distance * Math.cos(angle);
                    let endY = cy + distance * Math.sin(angle);
                    petalEndPoints.push({ x: endX, y: endY, angle: petalAngle });
                }
            }
        }
        lilyPetals.sort((a, b) => a.distance - b.distance);
        drawQueue = drawQueue.concat(lilyPetals); // البتلات الزرقاء أولاً

        // -----------------------------------------
        // 4. الأسدية البيضاء (تأتي ثانياً وتتراكب فوق الأزرق)
        // -----------------------------------------
        const stamens = [];
        for (let s = 0; s < 6; s++) {
            let stamenAngle = (s / 6) * 2 * Math.PI + 0.2;
            for (let j = 0; j < 35; j++) {
                let dist = 10 + j * 2.2;
                if (dist > MAX_RADIUS * 0.65) break;
                let color = j < 30 ? 
                    `rgba(200, 190, 230, ${0.25 - (j/35)*0.15})` : 
                    `rgba(255, 255, 255, 0.3)`;
                stamens.push({ distance: dist, angle: stamenAngle, w: 2, h: j < 30 ? 4 : 12, color });
            }
        }
        stamens.sort((a, b) => a.distance - b.distance);
        drawQueue = drawQueue.concat(stamens); // الأسدية تتراكب فوق البتلات

        // -----------------------------------------
        // 5. أنيميشن الرسم البطيء للزهرة
        // -----------------------------------------
        ctx.lineWidth = 5.5;
        ctx.shadowBlur = 15; 
        ctx.shadowColor = 'rgba(30, 20, 60, 0.2)'; 

        const DRAW_DELAY_MS = 55;

        // خلفية ثابتة
        ctx.fillStyle = '#04020a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // ----------------------
        // مرحلة النزيف (من أطراف البتلات)
        // ----------------------
        function startBleeding() {
            isDrawingFlower = false;
            isBleeding = true;
            startBleedDrops();
        }

        function startBleedDrops() {
            // 40 خطوة نزول للقطرات
            if (bleedStep > 45) {
                isBleeding = false;
                setTimeout(showLoveText, 500); // بعد النزيف، تظهر الرسالة
                return;
            }
            
            let t = bleedStep / 45;
            
            // رسم قطرات الدم من أطراف البتلات الست
            for (let p = 0; p < petalEndPoints.length; p++) {
                let end = petalEndPoints[p];
                
                // حركة القطرة: تتحرك من طرف البتلة إلى الأسفل (مع الميلان قليلاً للمركز)
                let progressX = end.x - (end.x - cx) * t * 0.5; // تنزلق نحو المركز قليلاً
                let progressY = end.y + (t * 180); // تنزل للأسفل
                
                // رسم قطرة الدم (حلقة بيضاوية باهتة)
                ctx.save();
                ctx.beginPath();
                // شكل الدمعة: بيضاوي مائل قليلاً
                ctx.ellipse(progressX, progressY, 4 + t * 3, 6 + t * 5, end.angle, 0, Math.PI * 2);
                
                // لون الدم الأزرق الغامق، بهتان يزداد كلما ابتعدت القطرة
                let alpha = 0.6 - t * 0.4;
                ctx.fillStyle = `rgba(20, 15, 50, ${Math.max(0.1, alpha)})`;
                ctx.shadowBlur = 15;
                ctx.shadowColor = 'rgba(20, 15, 50, 0.4)';
                ctx.fill();
                ctx.restore();
            }
            
            bleedStep++;
            setTimeout(startBleedDrops, 120); // نزول بطيء للقطرات
        }

        // ----------------------
        // مرحلة الرسالة (I love u samo) - ترسم بواسطة القطرات
        // ----------------------
        function showLoveText() {
            let text = "I love u samo";
            // ضبط التوهج للجمله
            ctx.shadowBlur = 25;
            ctx.shadowColor = 'rgba(40, 30, 70, 0.4)';
            
            // خط جميل
            ctx.font = "bold 45px 'Brush Script MT', 'Great Vibes', cursive";
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // **موقع الجملة: تحت الزهرة مباشرة (فوق بداية الجذع)**
            let yPos = cy + 170; 
            let step = 0;
            
            let textInterval = setInterval(() => {
                if (step > text.length) {
                    clearInterval(textInterval);
                    return;
                }
                
                // كتابة الحروف المتراكمة
                let partialText = text.substring(0, step);
                
                // لون الحروف يشبه الدم الأزرق
                ctx.fillStyle = `rgba(40, 25, 70, ${0.8})`;
                ctx.fillText(partialText, cx, yPos);
                
                // إضافة قطرات دم صغيرة حول كل حرف عند ظهوره لتحقيق "القطرات ترسم الجمله"
                for (let d = 0; d < 3; d++) {
                    let dropX = cx + (Math.random() - 0.5) * (step * 25);
                    let dropY = yPos + (Math.random() - 0.5) * 20;
                    ctx.beginPath();
                    ctx.arc(dropX, dropY, 2 + Math.random() * 4, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(20, 15, 50, ${0.2 + Math.random() * 0.3})`;
                    ctx.shadowBlur = 15;
                    ctx.fill();
                }
                
                step++;
            }, 180); // بطء ظهور الحروف
        }

        // ----------------------
        // حلقة الرسم الرئيسية
        // ----------------------
        function drawItemFromQueue() {
            if (!isDrawingFlower) return;

            if (currentIndex >= drawQueue.length) {
                isDrawingFlower = false;
                setTimeout(startBleeding, 300); // عند انتهاء الزهرة، انتظر قليلاً ثم ابدأ النزيف
                return;
            }

            const item = drawQueue[currentIndex];

            if (item.type === 'stem') {
                ctx.beginPath();
                ctx.moveTo(stemPoints[Math.max(0, item.idx - 1)].x, stemPoints[Math.max(0, item.idx - 1)].y);
                ctx.lineTo(stemPoints[item.idx].x, stemPoints[item.idx].y);
                ctx.strokeStyle = 'rgba(35, 45, 60, 0.7)';
                ctx.lineWidth = 6.5;
                ctx.shadowBlur = 0; // الساق بدون توهج
                ctx.stroke();
                ctx.shadowBlur = 15;
            } 
            else if (item.type === 'base') {
                ctx.save();
                ctx.translate(item.x, item.y);
                ctx.beginPath();
                ctx.ellipse(0, 0, item.w, item.h, 0, 0, Math.PI * 2);
                ctx.fillStyle = item.color;
                ctx.fill();
                ctx.restore();
            } 
            else {
                const ring = item;
                const x = cx + ring.distance * Math.cos(ring.angle);
                const y = cy + ring.distance * Math.sin(ring.angle);
                
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(ring.angle + Math.PI / 2);
                
                ctx.beginPath();
                ctx.ellipse(0, 0, ring.w, ring.h, 0, 0, Math.PI * 2);
                ctx.strokeStyle = ring.color;
                ctx.lineWidth = ring.distance < 30 ? 7 : 5; // حلقات عريضة
                ctx.stroke();
                
                ctx.restore();
            }

            currentIndex++;
            setTimeout(drawItemFromQueue, DRAW_DELAY_MS);
        }

        // بدء الرسم
        setTimeout(drawItemFromQueue, 600);

        // إعادة ضبط الشاشة
        window.addEventListener('resize', () => {
            // للحصول على أفضل تجربة، يُفضل تحديث الصفحة (F5) عند تغيير حجم النافذة.
        });

    </script>
</body>
</html>
