<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flower Being Drawn</title>
<style>
    *{box-sizing:border-box}
    html,body{
        margin:0;
        width:100%;
        height:100%;
        overflow:hidden;
        background:#10030f;
    }
    canvas{
        display:block;
        width:100vw;
        height:100vh;
        background:#10030f;
    }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<script>
/*
    FLOWER PARTICLE DRAWING
    ------------------------
    The flower is NOT painted instantly.

    It is constructed from thousands of tiny circles/squares.
    The drawing starts at the bottom of the stem, travels upward,
    grows the leaf, reaches the flower, then slowly builds many
    irregular petals from the center outward.

    Click anywhere to restart.
*/

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H, dpr, scale;
let particles = [];
let startTime = 0;
let raf = 0;

const TAU = Math.PI * 2;

function resize(){
    W = innerWidth;
    H = innerHeight;
    dpr = Math.min(devicePixelRatio || 1, 2);

    canvas.width = W*dpr;
    canvas.height = H*dpr;
    canvas.style.width = W+"px";
    canvas.style.height = H+"px";

    ctx.setTransform(dpr,0,0,dpr,0,0);

    /*
       The reference flower is roughly centered.
       scale keeps the proportions on phones and desktop.
    */
    scale = Math.min(W/1280, H/940);

    makeDrawing();
}

function bg(){
    ctx.fillStyle = "#10030f";
    ctx.fillRect(0,0,W,H);
}

/* deterministic random number */
function rand(n){
    const x = Math.sin(n*127.137 + 19.71)*43758.5453123;
    return x-Math.floor(x);
}

function point(x,y,type,color,size,delay,alpha=1){
    particles.push({
        x,y,type,color,size,delay,alpha,
        jitter:(rand(particles.length*7.13)-.5)*1.7
    });
}

/* Add a continuous stream of particles along a parametric path */
function pathParticles(fn, count, delayStart, delayStep, color, size, seed, shapeBias=.5){
    for(let i=0;i<count;i++){
        const t=i/(count-1);
        const p=fn(t);

        /*
          Small controlled errors make the line look handmade,
          rather than like a mathematically perfect SVG.
        */
        const j=(rand(seed+i*3.77)-.5)*2.6*scale;

        point(
            p.x + j,
            p.y + (rand(seed+i*5.21)-.5)*2.6*scale,
            rand(seed+i*11.7)<shapeBias ? "dot" : "square",
            color,
            size*(0.72+rand(seed+i*4.31)*.65),
            delayStart+i*delayStep,
            .52+rand(seed+i*2.17)*.48
        );
    }
}

/* Cubic Bezier */
function bezier(a,b,c,d,t){
    const u=1-t;
    return {
        x:u*u*u*a.x+3*u*u*t*b.x+3*u*t*t*c.x+t*t*t*d.x,
        y:u*u*u*a.y+3*u*u*t*b.y+3*u*t*t*c.y+t*t*t*d.y
    };
}

/* Flower coordinates */
function geo(){
    const cx=W*.50;
    const baseY=H*.985;

    return {
        cx,
        baseY,

        // Stem travels upward, slightly to the left,
        // then enters the center of the flower.
        stemA:{x:cx+150*scale,y:baseY},
        stemB:{x:cx+38*scale,y:H*.82},
        stemC:{x:cx-5*scale,y:H*.66},
        stemD:{x:cx,y:H*.515},

        flowerX:cx,
        flowerY:H*.43
    };
}

function makeDrawing(){
    particles=[];
    const g=geo();

    /*
      --------------------------------------------------------
      PHASE 1 — STEM
      --------------------------------------------------------
      It begins at the bottom and grows upward.
    */
    let delay=0;

    const stemFn=t=>bezier(
        g.stemA,g.stemB,g.stemC,g.stemD,t
    );

    pathParticles(
        stemFn,
        1250,
        0,
        10.2,
        "#17985f",
        3.0*scale,
        1001,
        .76
    );

    /*
      Fine second trace beside the stem.
    */
    pathParticles(
        t=>{
            const p=stemFn(t);
            return {
                x:p.x+Math.sin(t*18)*2.1*scale,
                y:p.y+Math.cos(t*13)*1.2*scale
            }
        },
        650,
        2400,
        13.0,
        "#0c6547",
        1.45*scale,
        2001,
        .58
    );

    /*
      --------------------------------------------------------
      PHASE 2 — LEAF
      --------------------------------------------------------
      The leaf grows after the stem reaches its middle.
    */
    const leafStart=12600;

    function leafCurve(t){
        const x0=g.cx+32*scale;
        const y0=H*.73;

        return {
            x:x0 + 92*scale*t + 20*scale*Math.sin(Math.PI*t),
            y:y0 - 25*scale*Math.sin(Math.PI*t)
                    - 9*scale*Math.sin(Math.PI*2*t)
        };
    }

    pathParticles(
        leafCurve,
        430,
        leafStart,
        12,
        "#168a58",
        2.7*scale,
        3001,
        .72
    );

    // leaf veins
    for(let v=0;v<9;v++){
        const yy=v/8;
        pathParticles(
            t=>{
                const p=leafCurve(t);
                return {
                    x:p.x,
                    y:p.y+(yy-.5)*18*scale*t
                }
            },
            55,
            leafStart+1800+v*170,
            7.0,
            "#0d6748",
            1.05*scale,
            3100+v,
            .7
        );
    }

    /*
      --------------------------------------------------------
      PHASE 3 — CENTRAL FLOWER RECEPTACLE
      --------------------------------------------------------
    */
    const flowerStart=19000;

    pathParticles(
        t=>{
            const a=t*TAU;
            const r=9*scale+7*scale*t;
            return {
                x:g.flowerX+Math.cos(a)*r,
                y:g.flowerY+Math.sin(a)*r*.68
            }
        },
        430,
        flowerStart,
        8.5,
        "#b71961",
        2.3*scale,
        4001,
        .65
    );

    /*
      --------------------------------------------------------
      PHASE 4 — PETALS
      --------------------------------------------------------
      Lots of irregular continuous loops.

      Each loop is deliberately different in width, height,
      tilt and wobble. The result becomes a complex rose-like
      flower instead of a simple geometric flower.
    */

    const petals=32;

    for(let p=0;p<petals;p++){
        const layer=p%8;
        const row=Math.floor(p/8);

        const angle=(p/petals)*TAU + (rand(500+p)-.5)*.35;

        const rx=(75 + layer*20 + rand(600+p)*45)*scale;
        const ry=(25 + layer*7 + rand(700+p)*25)*scale;

        const centerRadius=(row*27 + rand(800+p)*22)*scale;

        const start=flowerStart+2500+p*850;
        const count=260+Math.floor(rand(900+p)*170);

        pathParticles(
            t=>{
                const a=t*TAU;

                /*
                  Rose-like overlapping loops.
                */
                const wobble=
                    1
                    +.10*Math.sin(a*3+p)
                    +.045*Math.sin(a*7+p*1.7)
                    +.025*Math.sin(a*13+p);

                const localX=Math.cos(a)*rx*wobble;
                const localY=Math.sin(a)*ry*wobble;

                // rotate loop
                const co=Math.cos(angle);
                const si=Math.sin(angle);

                let x=localX*co-localY*si;
                let y=localX*si+localY*co;

                // shift individual petals around the center
                x += Math.cos(angle)*centerRadius;
                y += Math.sin(angle)*centerRadius*.55;

                return {
                    x:g.flowerX+x,
                    y:g.flowerY+y
                };
            },
            count,
            start,
            7.0+row*.7,
            p%3===0 ? "#ff2479" : (p%3===1 ? "#e20c67" : "#b80d5b"),
            (1.45+rand(1000+p)*2.2)*scale,
            5000+p,
            .55
        );

        /*
          Every few petals receive a second noisy trace.
        */
        if(p%2===0){
            pathParticles(
                t=>{
                    const a=t*TAU;
                    const wobble=1+.08*Math.sin(a*5+p);
                    const xx=Math.cos(a)*rx*1.025*wobble;
                    const yy=Math.sin(a)*ry*1.04*wobble;

                    const co=Math.cos(angle), si=Math.sin(angle);

                    return {
                        x:g.flowerX+
                          xx*co-yy*si+
                          Math.cos(angle)*centerRadius,
                        y:g.flowerY+
                          xx*si+yy*co+
                          Math.sin(angle)*centerRadius*.55
                    };
                },
                Math.floor(count*.48),
                start+1600,
                9.5,
                "#ff3b87",
                .9*scale,
                7000+p,
                .62
            );
        }
    }

    /*
      --------------------------------------------------------
      PHASE 5 — MANY INNER COILS
      --------------------------------------------------------
      These create the complicated rose center.
    */
    const coilStart=flowerStart+21000;

    for(let c=0;c<18;c++){
        const turns=1.7+rand(8000+c)*2.4;
        const maxR=(18+c*5.5)*scale;

        pathParticles(
            t=>{
                const a=t*turns*TAU;
                const r=maxR*(.10+.90*t);

                return {
                    x:g.flowerX+
                      Math.cos(a)*r+
                      Math.sin(a*2.7+c)*3*scale,
                    y:g.flowerY+
                      Math.sin(a)*r*.62+
                      Math.cos(a*3+c)*2*scale
                };
            },
            180,
            coilStart+c*500,
            5.2,
            c%2 ? "#ff2b7c" : "#c20b60",
            (1.15+rand(c+9000)*1.8)*scale,
            9000+c,
            .65
        );
    }

    /*
      A few tiny particles around the outer silhouette,
      making the final flower feel organic and detailed.
    */
    const outerStart=flowerStart+25500;

    for(let q=0;q<900;q++){
        const a=rand(12000+q)*TAU;
        const r=(105+rand(13000+q)*145)*scale;

        // broad flower silhouette
        const squash=.58+rand(14000+q)*.22;

        point(
            g.flowerX+Math.cos(a)*r,
            g.flowerY+Math.sin(a)*r*squash,
            rand(15000+q)<.62 ? "dot":"square",
            rand(16000+q)<.5 ? "#e90f6c":"#ff2d82",
            (.7+rand(17000+q)*1.5)*scale,
            outerStart+q*15,
            .20+rand(18000+q)*.55
        );
    }

    /*
      Keep the final animation duration readable.
    */
    particles.sort((a,b)=>a.delay-b.delay);
}

function drawParticle(p, progress){
    if(progress<=0) return;

    const x=p.x + Math.sin(progress*7+p.jitter)*.22*scale;
    const y=p.y + Math.cos(progress*6+p.jitter)*.22*scale;

    ctx.globalAlpha=p.alpha;

    if(p.type==="square"){
        ctx.fillStyle=p.color;
        const s=p.size;
        ctx.fillRect(x-s*.5,y-s*.5,s,s);
    }else{
        ctx.fillStyle=p.color;
        ctx.beginPath();
        ctx.arc(x,y,p.size*.5,0,TAU);
        ctx.fill();
    }
}

/*
   Draw particles in batches.
   A small glow is added only around the flower head.
*/
function render(now){
    bg();

    const elapsed=now-startTime;

    // Slow, elegant drawing.
    // Around 48 seconds for the complete flower.
    for(let i=0;i<particles.length;i++){
        const p=particles[i];

        /*
          Each particle appears progressively instead of all at once.
        */
        const local=(elapsed-p.delay)/85;

        if(local>0){
            drawParticle(p,Math.min(1,local));
        }
    }

    ctx.globalAlpha=1;

    // Very subtle glow following the latest drawing position.
    if(particles.length){
        let latest=null;

        for(let i=particles.length-1;i>=0;i--){
            if(particles[i].delay<=elapsed){
                latest=particles[i];
                break;
            }
        }

        if(latest){
            ctx.save();
            ctx.globalAlpha=.10;
            ctx.shadowBlur=18*scale;
            ctx.shadowColor=latest.color;
            ctx.fillStyle=latest.color;
            ctx.beginPath();
            ctx.arc(latest.x,latest.y,3.2*scale,0,TAU);
            ctx.fill();
            ctx.restore();
        }
    }

    /*
      Once finished, leave the flower on screen for a while,
      then restart automatically.
    */
    const last=particles[particles.length-1]?.delay || 0;

    if(elapsed>last+8500){
        startTime=now;
    }

    raf=requestAnimationFrame(render);
}

function restart(){
    cancelAnimationFrame(raf);
    makeDrawing();
    startTime=performance.now();
    raf=requestAnimationFrame(render);
}

addEventListener("resize",()=>{
    resize();
    restart();
});

canvas.addEventListener("click",restart);

resize();
restart();
</script>
</body>
</html>
