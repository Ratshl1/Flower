<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الزنبقة الزرقاء - رسالة الدم النيون</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #06020f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            touch-action: none;
        }
        canvas {
            display: block;
            background-color: #06020f;
        }
    </style>
</head>
<body>
    <canvas id="flowerCanvas"></canvas>

    <script>
        const canvas = document.getElementById('flowerCanvas');
        const ctx = canvas.getContext('2d');

        // ضبط دقة الشاشة للجوال
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        let drawQueue = [];
        let currentIndex = 0;
        let petalEndPoints = []; // لتخزين أطراف البتلات

        let isDrawingFlower = true;
        let isBleeding = false;
        let bleedStep = 0;

        const MAX_RADIUS = Math.min(canvas.width, canvas.height) * 0.35; 
        const CENTER_GAP = 130; // فجوة مركز الزهرة

        // -----------------------------------------
        // 1. توليد الساق المتصلة بالزهرة
        // -----------------------------------------
        function generateStemPoints() {
            const points = [];
            const steps = 120;
            const startY = cy + 350; 
            const startX = cx + 20; 
            for (let i = 0; i <= steps; i++) {
                let t = i / steps;
                let x = startX - (t * 22); 
                let y = startY - (t * (350 - CENTER_GAP)); 
                points.push({x, y});
            }
            return points;
        }

        const stemPoints = generateStemPoints();
        for (let i = 0; i < stemPoints.length; i++) {
            drawQueue.push({ type: 'stem', idx: i });
        }

        // -----------------------------------------
        // 2. قاعدة الزهرة (القمع / الربط)
        // -----------------------------------------
        function generateReceptacle() {
            const loops = [];
            for (let i = 0; i < 80; i++) {
                let t = i / 80;
                let yOffset = CENTER_GAP - (t * 40); 
                let xOffset = -15 + (t * 30);
                let w = 15 + t * 25;
                let h = 10 + t * 15;
                let color = `rgba(20, 25, 45, ${0.4 - t * 0.15})`;
                loops.push({ type: 'base', x: cx + xOffset, y: cy + yOffset, w, h, angle: 0, color });
            }
            return loops;
        }
        drawQueue = drawQueue.concat(generateReceptacle());

        // -----------------------------------------
        // 3. بتلات الزهرة (ألوان زرقاء وأطراف سوداء)
        // -----------------------------------------
        const lilyPetals = [];
        const numPetals = 6;
        const ringsPerPetal = 120;

        for (let p = 0; p < numPetals; p++) {
            let petalAngle = (p / numPetals) * 2 * Math.PI;
            for (let j = 0; j < ringsPerPetal; j++) {
                let t = j / ringsPerPetal;
                let distance = 5 + (t * MAX_RADIUS);
                if (distance > MAX_RADIUS) break; 
                let angleOffset = Math.sin(j * 0.02) * 0.3; 
                let angle = petalAngle + angleOffset;
                
                let shapeFactor = Math.sin(t * Math.PI); 
                let w = 10 + shapeFactor * 25; 
                let h = 15 + shapeFactor * 30; 
                
                let alpha = 0.25 - (t * 0.20); 
                alpha = Math.max(0.02, alpha);
                
                let r = 30 + t * 50;
                let g = 30 + t * 60;
                let b = 100 + t * 80;
                
                // تحويل الألوان إلى الأسود عند الأطراف (كما في الصورة)
                let fadeToBlack = Math.pow(t, 2.5);
                r = r * (1 - fadeToBlack) + 5 * fadeToBlack;
                g = g * (1 - fadeToBlack) + 5 * fadeToBlack;
                b = b * (1 - fadeToBlack) + 5 * fadeToBlack;
                
                let color = `rgba(${Math.floor(r)}, ${Math.floor(g)}, ${Math.floor(b)}, ${alpha})`;
                lilyPetals.push({ distance, angle, w, h, color });

                // تسجيل أطراف البتلات لنزول الدم منها
                if (j === ringsPerPetal - 1) {
                    let endX = cx + distance * Math.cos(angle);
                    let endY = cy + distance * Math.sin(angle);
                    petalEndPoints.push({ x: endX, y: endY, angle: petalAngle });
                }
            }
        }
        lilyPetals.sort((a, b) => a.distance - b.distance);
        drawQueue = drawQueue.concat(lilyPetals);

        // -----------------------------------------
        // 4. الأسدية البيضاء (فوق الأزرق)
        // -----------------------------------------
        const stamens = [];
        for (let s = 0; s < 6; s++) {
            let stamenAngle = (s / 6) * 2 * Math.PI + 0.2;
            for (let j = 0; j < 35; j++) {
                let dist = 10 + j * 2.2;
                if (dist > MAX_RADIUS * 0.65) break;
                let color = j < 30 ? 
                    `rgba(200, 190, 230, ${0.25 - (j/35)*0.15})` : 
                    `rgba(255, 255, 255, 0.3)`;
                stamens.push({ distance: dist, angle: stamenAngle, w: 2, h: j < 30 ? 4 : 12, color });
            }
        }
        stamens.sort((a, b) => a.distance - b.distance);
        drawQueue = drawQueue.concat(stamens);

        // -----------------------------------------
        // 5. إعدادات الرسم البطيء للزهرة
        // -----------------------------------------
        ctx.lineWidth = 5.5;
        ctx.shadowBlur = 15; 
        ctx.shadowColor = 'rgba(30, 20, 60, 0.2)'; 

        const DRAW_DELAY_MS = 55;

        ctx.fillStyle = '#06020f';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // ============================================
        // مرحلة النزيف الحقيقية (تسيل من الأطراف إلى الأسفل)
        // ============================================
        function startBleeding() {
            isDrawingFlower = false;
            isBleeding = true;
            startBleedDrops();
        }

        function startBleedDrops() {
            // عدد خطوات النزول (كلما زاد، كلما كان النزول أبطأ وأكثر انسيابية)
            if (bleedStep > 100) {
                isBleeding = false;
                setTimeout(showLoveText, 400);
                return;
            }
            
            let t = bleedStep / 100;
            
            // رسم قطرة دم من كل طرف بتلة
            for (let p = 0; p < petalEndPoints.length; p++) {
                let end = petalEndPoints[p];
                
                // **حساب مسار القطرة بدقة: تبدأ من طرف البتلة، وتنزلق تدريجياً إلى الأسفل**
                let startX = end.x;
                let startY = end.y + 10;
                let endX = startX - (startX - cx) * 0.5; // تتجه قليلاً للمركز أثناء النزول
                let endY = cy + 165; // تتوقف أسفل الزهرة (فوق الجذع)
                
                let progressX = startX + (endX - startX) * t;
                let progressY = startY + (endY - startY) * t;
                
                ctx.save();
                // **تأثير نيون أزرق براق جداً للقطرات**
                ctx.shadowBlur = 40;
                ctx.shadowColor = 'rgba(60, 140, 255, 0.8)';
                
                ctx.beginPath();
                // حجم القطرة يتغير أثناء النزول (تكبر قليلاً)
                let size = 6 + t * 6;
                ctx.ellipse(progressX, progressY, size, size + 4, end.angle, 0, Math.PI * 2);
                // درجة الشفافية: تبدأ قوية جداً وتخفت قليلاً عند الوصول للأسفل لتبدو سلسة
                ctx.fillStyle = `rgba(40, 120, 255, ${Math.max(0.3, 0.95 - t * 0.4)})`;
                ctx.fill();
                ctx.restore();
            }
            
            bleedStep++;
            setTimeout(startBleedDrops, 75); // 75 مللي ثانية بين كل قطرة = حركة بطيئة وواضحة
        }

        // ============================================
        // مرحلة الجملة (أزرق نيون، وقطرات تكتب الحروف)
        // ============================================
        function showLoveText() {
            let text = "I love u samo";
            
            // **العودة للألوان النيون، وإزالة الأخطاء التي تسبب التداخل**
            ctx.shadowBlur = 25;
            ctx.shadowColor = '#4d94ff';
            ctx.font = "bold 50px 'Brush Script MT', 'Great Vibes', cursive, sans-serif";
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            let yPos = cy + 165; // فوق الجذع، تحت الزهرة مباشرة
            let step = 0;
            
            let textInterval = setInterval(() => {
                if (step > text.length) {
                    clearInterval(textInterval);
                    return;
                }
                
                let partialText = text.substring(0, step);
                
                // **حل مشكلة التداخل: نستخدم فقط FillText، وبدون StrokeText**
                ctx.fillStyle = '#6699ff'; // لون أزرق نيون مركزي
                ctx.fillText(partialText, cx, yPos);
                
                // **تطاير قطرات النيون الصغيرة بجانب كل حرف (تمثل الدم النازف يكتب الكلمات)**
                for (let d = 0; d < 5; d++) {
                    let dropX = cx + (Math.random() - 0.5) * (step * 22);
                    let dropY = yPos + (Math.random() - 0.5) * 24;
                    
                    ctx.save();
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = '#4d94ff';
                    ctx.beginPath();
                    ctx.arc(dropX, dropY, 2 + Math.random() * 4, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(40, 160, 255, ${0.6 + Math.random() * 0.4})`;
                    ctx.fill();
                    ctx.restore();
                }
                
                step++;
            }, 160); // كتابة حرف كل 160 مللي ثانية
        }

        // ============================================
        // حلقة الرسم الرئيسية (حلقات الزهرة)
        // ============================================
        function drawItemFromQueue() {
            if (!isDrawingFlower) return;

            if (currentIndex >= drawQueue.length) {
                isDrawingFlower = false;
                setTimeout(startBleeding, 500); // انتظر قليلاً بعد تفتح الزهرة ثم ابدأ النزيف
                return;
            }

            const item = drawQueue[currentIndex];

            if (item.type === 'stem') {
                ctx.beginPath();
                ctx.moveTo(stemPoints[Math.max(0, item.idx - 1)].x, stemPoints[Math.max(0, item.idx - 1)].y);
                ctx.lineTo(stemPoints[item.idx].x, stemPoints[item.idx].y);
                ctx.strokeStyle = 'rgba(35, 45, 60, 0.7)';
                ctx.lineWidth = 6.5;
                ctx.shadowBlur = 0;
                ctx.stroke();
                ctx.shadowBlur = 15;
            } 
            else if (item.type === 'base') {
                ctx.save();
                ctx.translate(item.x, item.y);
                ctx.beginPath();
                ctx.ellipse(0, 0, item.w, item.h, 0, 0, Math.PI * 2);
                ctx.fillStyle = item.color;
                ctx.fill();
                ctx.restore();
            } 
            else {
                const ring = item;
                const x = cx + ring.distance * Math.cos(ring.angle);
                const y = cy + ring.distance * Math.sin(ring.angle);
                
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(ring.angle + Math.PI / 2);
                
                ctx.beginPath();
                ctx.ellipse(0, 0, ring.w, ring.h, 0, 0, Math.PI * 2);
                ctx.strokeStyle = ring.color;
                ctx.lineWidth = ring.distance < 30 ? 7 : 5;
                ctx.stroke();
                
                ctx.restore();
            }

            currentIndex++;
            setTimeout(drawItemFromQueue, DRAW_DELAY_MS);
        }

        // بدء الرسم
        setTimeout(drawItemFromQueue, 600);

        window.addEventListener('resize', () => {
            // لتجنب أي أخطاء عند تدوير الشاشة، ننصح بتحديث الصفحة
        });

    </script>
</body>
</html>
