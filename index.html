<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>زنبقتان تنبضان بالحياة 🌸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cairo:wght@300;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background: radial-gradient(circle at 50% 38%, #2c1533 0%, #180a1f 55%, #0a0510 100%);
    font-family:'Cairo',sans-serif;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .stage{
    position:relative;
    width:min(96vw, 900px);
    aspect-ratio: 9 / 7;
  }
  svg{ width:100%; height:100%; display:block; }

  /* stem / leaf draw-on */
  .draw-line{
    stroke-dasharray:1;
    stroke-dashoffset:1;
    animation: drawLine 1.1s ease forwards;
  }
  @keyframes drawLine{
    to{ stroke-dashoffset:0; }
  }

  /* heart stamp pop-in (built by JS with per-stamp delay) */
  .stamp{
    opacity:0;
    transform-box: fill-box;
    transform-origin:center;
    transform: scale(0);
    animation: pop .5s cubic-bezier(.3,1.4,.5,1) forwards;
  }
  @keyframes pop{
    0%{ opacity:0; transform:scale(0) rotate(var(--r,0deg)); }
    60%{ opacity:1; transform:scale(1.25) rotate(var(--r,0deg)); }
    100%{ opacity:.95; transform:scale(1) rotate(var(--r,0deg)); }
  }

  /* life glow burst */
  .lifeburst{
    opacity:0;
    transform-box: fill-box;
    transform-origin:center;
    transform:scale(0.3);
  }
  .lifeburst.go{
    animation: burst 1.1s ease-out forwards;
  }
  @keyframes burst{
    0%{ opacity:0; transform:scale(0.3);}
    40%{ opacity:.85; transform:scale(1.1);}
    100%{ opacity:0; transform:scale(1.6);}
  }

  .flower-wrap{
    transform: translate(var(--tx), var(--ty));
  }
  .flower-wrap.alive{
    animation: bounce 1s ease-out;
  }
  @keyframes bounce{
    0%{ transform:translate(var(--tx), var(--ty)) scale(1); }
    35%{ transform:translate(var(--tx), var(--ty)) scale(1.05); }
    100%{ transform:translate(var(--tx), var(--ty)) scale(1); }
  }

  /* idle shimmer once alive */
  .flower-wrap.settled{
    animation: sway 5s ease-in-out infinite;
  }
  @keyframes sway{
    0%,100%{ transform:translate(var(--tx), var(--ty)) rotate(0deg); }
    50%{ transform:translate(var(--tx), var(--ty)) rotate(0.7deg); }
  }

  /* finale text */
  .love-text{
    opacity:0;
    transition: opacity 2s ease;
  }
  .scene.text-on .love-text{
    opacity:1;
  }
  .love-text text{
    font-family:'Great Vibes', cursive;
    fill: url(#textGrad);
    font-size: 88px;
    filter: drop-shadow(0 3px 10px rgba(255,60,140,0.55));
    transform-box: fill-box;
    transform-origin: center;
    transform: translateY(20px) scale(0.85);
    transition: transform 2s cubic-bezier(.2,.9,.25,1.2);
  }
  .scene.text-on .love-text text{
    transform: translateY(0) scale(1);
  }
  .love-glow{
    opacity:0;
    transition: opacity 2.2s ease;
  }
  .scene.text-on .love-glow{ opacity:0.6; }

  .replay{
    position:absolute;
    bottom:8px;
    right:50%;
    transform:translateX(50%);
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,190,220,.4);
    color:#ffc9e6;
    padding:6px 16px;
    border-radius:20px;
    font-family:'Cairo',sans-serif;
    font-size:13px;
    cursor:pointer;
    backdrop-filter: blur(4px);
  }
  .replay:hover{ background:rgba(255,255,255,.16); }

  @media (prefers-reduced-motion: reduce){
    .draw-line, .stamp, .lifeburst, .flower-wrap, .love-text, .love-glow{
      animation:none !important;
      transition:none !important;
    }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="scene" id="scene">
    <svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#2f7d3a"/>
          <stop offset="100%" stop-color="#57b768"/>
        </linearGradient>
        <radialGradient id="burstGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff3e0" stop-opacity="0.95"/>
          <stop offset="55%" stop-color="#ff9ecb" stop-opacity="0.45"/>
          <stop offset="100%" stop-color="#ff9ecb" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#ff7fb4"/>
          <stop offset="50%" stop-color="#ff2e8f"/>
          <stop offset="100%" stop-color="#ff7fb4"/>
        </linearGradient>
        <radialGradient id="loveGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffb3da" stop-opacity="0.85"/>
          <stop offset="100%" stop-color="#ffb3da" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff6d8" stop-opacity="0.9"/>
          <stop offset="100%" stop-color="#fff6d8" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- soft ambient stars -->
      <g fill="#ffe9f5" opacity="0.35" id="stars"></g>

      <!-- ============= FLOWER 1 ============= -->
      <g class="flower-wrap" id="flower1" style="--tx:300px;--ty:560px">
        <circle class="lifeburst" id="burst1" r="150" fill="url(#burstGrad)"/>
        <path class="draw-line" pathLength="1" d="M0,0 C -8,-95 10,-175 0,-268" stroke="url(#stemGrad)" stroke-width="7" fill="none" stroke-linecap="round"/>
        <path class="draw-line" pathLength="1" style="animation-delay:.35s" d="M-3,-150 C -42,-158 -60,-134 -78,-138 C -54,-118 -28,-124 -3,-150 Z" fill="none" stroke="#3f9a4c" stroke-width="4"/>
        <path class="draw-line" pathLength="1" style="animation-delay:.5s" d="M5,-198 C 45,-206 58,-184 76,-188 C 54,-168 28,-176 5,-198 Z" fill="none" stroke="#4fae5c" stroke-width="4"/>
        <g id="petals1" transform="translate(0,-268)"></g>
        <circle id="core1" r="0" fill="url(#centerGlow)"/>
      </g>

      <!-- ============= FLOWER 2 ============= -->
      <g class="flower-wrap" id="flower2" style="--tx:600px;--ty:560px">
        <circle class="lifeburst" id="burst2" r="150" fill="url(#burstGrad)"/>
        <path class="draw-line" pathLength="1" d="M0,0 C 8,-95 -10,-175 0,-268" stroke="url(#stemGrad)" stroke-width="7" fill="none" stroke-linecap="round"/>
        <path class="draw-line" pathLength="1" style="animation-delay:.35s" d="M4,-150 C 44,-158 62,-134 80,-138 C 56,-118 30,-124 4,-150 Z" fill="none" stroke="#3f9a4c" stroke-width="4"/>
        <path class="draw-line" pathLength="1" style="animation-delay:.5s" d="M-5,-198 C -47,-206 -60,-184 -78,-188 C -56,-168 -30,-176 -5,-198 Z" fill="none" stroke="#4fae5c" stroke-width="4"/>
        <g id="petals2" transform="translate(0,-268)"></g>
        <circle id="core2" r="0" fill="url(#centerGlow)"/>
      </g>

      <!-- ============= LOVE TEXT ============= -->
      <g class="love-text">
        <circle class="love-glow" cx="450" cy="470" r="130" fill="url(#loveGlow)"/>
        <text x="450" y="470" text-anchor="middle" dominant-baseline="middle">I love u</text>
      </g>
    </svg>
    <button class="replay" id="replayBtn">↻ إعادة</button>
  </div>
</div>

<script>
const svgNS = "http://www.w3.org/2000/svg";

// ring config: [length, width, color, pointCount]  -- light center -> deep pink outward
const RINGS = [
  [66,  14, "#ffe6f2", 9],
  [98,  19, "#ff9ecb", 11],
  [132, 24, "#ff4fa0", 13],
  [168, 28, "#c2178c", 15],
];
// 6 lily tepals fanned upward/outward (screen coords: -90deg = straight up)
const PETAL_ANGLES = [-158,-130,-102,-78,-50,-22];

function buildPetals(containerId, stampStep, startDelay){
  const g = document.getElementById(containerId);
  g.innerHTML = "";
  let i = 0;
  let maxDelay = startDelay;
  RINGS.forEach(([length,width,color,points])=>{
    PETAL_ANGLES.forEach(angleDeg=>{
      const baseAngle = angleDeg * Math.PI/180;
      for(let p=0;p<=points;p++){
        const theta = p*Math.PI/points;
        const out = length*Math.sin(theta);
        const side = width*Math.sin(theta)*Math.cos(theta);
        const rx = out*Math.cos(baseAngle) - side*Math.sin(baseAngle);
        const ry = out*Math.sin(baseAngle) + side*Math.cos(baseAngle);
        const delay = startDelay + i*stampStep;
        maxDelay = Math.max(maxDelay, delay);
        const t = document.createElementNS(svgNS,"text");
        t.setAttribute("x", rx.toFixed(1));
        t.setAttribute("y", ry.toFixed(1));
        t.setAttribute("text-anchor","middle");
        t.setAttribute("dominant-baseline","middle");
        t.setAttribute("font-size", (7 + length/34).toFixed(1));
        t.setAttribute("fill", color);
        t.setAttribute("class","stamp");
        t.style.setProperty("--r", (Math.random()*30-15).toFixed(1)+"deg");
        t.style.animationDelay = delay+"ms";
        t.textContent = "♥";
        g.appendChild(t);
        i++;
      }
    });
  });
  return maxDelay + 450; // time when building finishes
}

function playSequence(){
  const scene = document.getElementById('scene');
  scene.classList.remove('text-on');
  document.getElementById('flower1').classList.remove('alive','settled');
  document.getElementById('flower2').classList.remove('alive','settled');
  document.getElementById('burst1').classList.remove('go');
  document.getElementById('burst2').classList.remove('go');

  // re-trigger stem/leaf draw animations
  document.querySelectorAll('.draw-line').forEach(el=>{
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = '';
  });

  const petalStart = 750;
  const finish1 = buildPetals('petals1', 9, petalStart);
  const finish2 = buildPetals('petals2', 9, petalStart + 300);
  const finishAll = Math.max(finish1, finish2);

  setTimeout(()=>{
    document.getElementById('burst1').classList.add('go');
    document.getElementById('burst2').classList.add('go');
    document.getElementById('flower1').classList.add('alive');
    document.getElementById('flower2').classList.add('alive');
  }, finishAll);

  setTimeout(()=>{
    document.getElementById('flower1').classList.add('settled');
    document.getElementById('flower2').classList.add('settled');
  }, finishAll + 1100);

  setTimeout(()=>{
    scene.classList.add('text-on');
  }, finishAll + 900);
}

// twinkly ambient stars
const starsG = document.getElementById('stars');
for(let s=0;s<24;s++){
  const c = document.createElementNS(svgNS,"circle");
  c.setAttribute("cx", Math.random()*900);
  c.setAttribute("cy", Math.random()*380);
  c.setAttribute("r", (Math.random()*1.6+0.4).toFixed(1));
  starsG.appendChild(c);
}

document.getElementById('replayBtn').addEventListener('click', playSequence);
playSequence();
</script>

</body>
</html>
