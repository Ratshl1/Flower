<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Blue Lily</title>

<style>

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #05020a;

    touch-action: none;
}

#scene {
    position: relative;

    width: 100vw;
    height: 100vh;

    overflow: hidden;
}

canvas {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    display: block;

    pointer-events: none;
}

#flowerCanvas {
    z-index: 1;
}

#bloodCanvas {
    z-index: 2;
}

#textCanvas {
    z-index: 3;
}

</style>
</head>

<body>

<div id="scene">

    <canvas id="flowerCanvas"></canvas>

    <canvas id="bloodCanvas"></canvas>

    <canvas id="textCanvas"></canvas>

</div>


<script>

/* =========================================================
   CANVAS
========================================================= */

const flowerCanvas =
    document.getElementById("flowerCanvas");

const bloodCanvas =
    document.getElementById("bloodCanvas");

const textCanvas =
    document.getElementById("textCanvas");


const flowerCtx =
    flowerCanvas.getContext("2d");

const bloodCtx =
    bloodCanvas.getContext("2d");

const textCtx =
    textCanvas.getContext("2d");


let W;
let H;

let cx;
let cy;

let dpr;


/* =========================================================
   FLOWER VARIABLES
========================================================= */

let drawQueue = [];

let currentIndex = 0;

let petalEndPoints = [];

let stemPoints = [];

let isDrawingFlower = true;

let isBleeding = false;


/* =========================================================
   RESIZE
========================================================= */

function resizeCanvas() {

    W = window.innerWidth;
    H = window.innerHeight;

    dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    const canvases = [
        flowerCanvas,
        bloodCanvas,
        textCanvas
    ];


    canvases.forEach(canvas => {

        canvas.width =
            Math.floor(W * dpr);

        canvas.height =
            Math.floor(H * dpr);

        canvas.style.width =
            W + "px";

        canvas.style.height =
            H + "px";
    });


    flowerCtx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    bloodCtx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    textCtx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    cx = W / 2;
    cy = H / 2;


    buildFlower();
}


/* =========================================================
   BUILD FLOWER
========================================================= */

function buildFlower() {

    drawQueue = [];

    currentIndex = 0;

    petalEndPoints = [];


    const MAX_RADIUS =
        Math.min(W, H) * 0.35;


    /*
       هذه المسافة هي نقطة اتصال
       الزهرة بالجذع.
    */

    const CENTER_GAP =
        Math.min(
            125,
            H * 0.17
        );


    /* =====================================================
       STEM
    ===================================================== */

    function generateStemPoints() {

        const points = [];

        const steps = 170;


        /*
           يبدأ الجذع من أسفل الشاشة
           ويصعد حتى مركز الزهرة تقريبًا.

           سابقًا كان يتوقف قبل الزهرة،
           لذلك ظهر منفصلًا.
        */

        const bottomY =
            Math.min(
                H - 5,
                cy + 390
            );


        const topY =
            cy + CENTER_GAP - 5;


        const startX =
            cx + 20;


        for (
            let i = 0;
            i <= steps;
            i++
        ) {

            const t =
                i / steps;


            /*
               انحناء خفيف للجذع
            */

            const curve =
                Math.sin(
                    t * Math.PI
                ) * 18;


            const x =
                startX -
                t * 22 +
                curve;


            const y =
                bottomY -
                t *
                (
                    bottomY -
                    topY
                );


            points.push({
                x: x,
                y: y
            });
        }


        return points;
    }


    stemPoints =
        generateStemPoints();


    for (
        let i = 1;
        i < stemPoints.length;
        i++
    ) {

        drawQueue.push({
            type: "stem",
            idx: i
        });
    }


    /* =====================================================
       BASE OF FLOWER
    ===================================================== */

    for (
        let i = 0;
        i < 85;
        i++
    ) {

        const t =
            i / 84;


        const yOffset =
            CENTER_GAP -
            t * 42;


        const xOffset =
            -16 +
            t * 32;


        drawQueue.push({

            type: "base",

            x:
                cx +
                xOffset,

            y:
                cy +
                yOffset,

            w:
                15 +
                t * 27,

            h:
                10 +
                t * 16,

            color:
                `rgba(
                    20,
                    25,
                    45,
                    ${0.42 - t * 0.15}
                )`
        });
    }


    /* =====================================================
       PETALS
    ===================================================== */

    const lilyPetals = [];

    const numPetals = 6;

    const ringsPerPetal = 130;


    for (
        let p = 0;
        p < numPetals;
        p++
    ) {

        const petalAngle =
            (
                p /
                numPetals
            ) *
            Math.PI *
            2;


        let finalX = cx;

        let finalY = cy;


        for (
            let j = 0;
            j < ringsPerPetal;
            j++
        ) {

            const t =
                j /
                (ringsPerPetal - 1);


            const distance =
                5 +
                t *
                MAX_RADIUS;


            const angleOffset =
                Math.sin(
                    j * 0.018 +
                    p * 1.7
                )
                *
                0.12
                *
                t;


            const angle =
                petalAngle +
                angleOffset;


            const shapeFactor =
                Math.sin(
                    t * Math.PI
                );


            const w =
                10 +
                shapeFactor * 25;


            const h =
                15 +
                shapeFactor * 30;


            let alpha =
                0.28 -
                t * 0.20;


            alpha =
                Math.max(
                    0.025,
                    alpha
                );


            let r =
                30 +
                t * 50;


            let g =
                30 +
                t * 60;


            let b =
                100 +
                t * 80;


            const fade =
                Math.pow(
                    t,
                    2.5
                );


            r =
                r * (1 - fade)
                +
                5 * fade;


            g =
                g * (1 - fade)
                +
                5 * fade;


            b =
                b * (1 - fade)
                +
                5 * fade;


            lilyPetals.push({

                distance:
                    distance,

                angle:
                    angle,

                w:
                    w,

                h:
                    h,

                color:
                    `rgba(
                        ${Math.floor(r)},
                        ${Math.floor(g)},
                        ${Math.floor(b)},
                        ${alpha}
                    )`
            });


            finalX =
                cx +
                distance *
                Math.cos(angle);


            finalY =
                cy +
                distance *
                Math.sin(angle);
        }


        /*
           نقطة نزول الدم
        */

        petalEndPoints.push({

            startX:
                finalX,

            startY:
                finalY,

            angle:
                petalAngle
        });
    }


    lilyPetals.sort(
        (a, b) =>
            a.distance -
            b.distance
    );


    drawQueue =
        drawQueue.concat(
            lilyPetals
        );


    /* =====================================================
       STAMENS
    ===================================================== */

    const stamens = [];


    for (
        let s = 0;
        s < 6;
        s++
    ) {

        const stamenAngle =
            (
                s / 6
            ) *
            Math.PI *
            2
            +
            0.2;


        for (
            let j = 0;
            j < 35;
            j++
        ) {

            const dist =
                10 +
                j * 2.2;


            if (
                dist >
                MAX_RADIUS * 0.65
            ) {
                break;
            }


            stamens.push({

                distance:
                    dist,

                angle:
                    stamenAngle,

                w:
                    2,

                h:
                    j < 30
                    ? 4
                    : 12,

                color:
                    j < 30

                    ?

                    `rgba(
                        200,
                        190,
                        230,
                        ${0.25 -
                        (j / 35) * 0.15}
                    )`

                    :

                    "rgba(
                        255,
                        255,
                        255,
                        0.3
                    )"
            });
        }
    }


    stamens.sort(
        (a, b) =>
            a.distance -
            b.distance
    );


    drawQueue =
        drawQueue.concat(
            stamens
        );
}


/* =========================================================
   DRAW FLOWER
========================================================= */

function drawItemFromQueue() {

    if (!isDrawingFlower) {
        return;
    }


    if (
        currentIndex >=
        drawQueue.length
    ) {

        isDrawingFlower =
            false;


        setTimeout(
            startBleeding,
            700
        );


        return;
    }


    const item =
        drawQueue[
            currentIndex
        ];


    /* =====================================================
       STEM
    ===================================================== */

    if (
        item.type ===
        "stem"
    ) {

        const previous =
            stemPoints[
                item.idx - 1
            ];


        const current =
            stemPoints[
                item.idx
            ];


        /*
           جسم الجذع الأساسي
        */

        flowerCtx.beginPath();


        flowerCtx.moveTo(
            previous.x,
            previous.y
        );


        flowerCtx.lineTo(
            current.x,
            current.y
        );


        flowerCtx.strokeStyle =
            "rgba(31,42,54,0.95)";


        flowerCtx.lineWidth =
            9;


        flowerCtx.lineCap =
            "round";


        flowerCtx.shadowBlur =
            3;


        flowerCtx.shadowColor =
            "rgba(20,30,45,0.5)";


        flowerCtx.stroke();


        /*
           الخط الداخلي للجذع
        */

        flowerCtx.beginPath();


        flowerCtx.moveTo(
            previous.x - 1.5,
            previous.y
        );


        flowerCtx.lineTo(
            current.x - 1.5,
            current.y
        );


        flowerCtx.strokeStyle =
            "rgba(65,78,88,0.65)";


        flowerCtx.lineWidth =
            2;


        flowerCtx.shadowBlur =
            0;


        flowerCtx.stroke();


        /*
           تفاصيل صغيرة / عروق على الجذع
        */

        if (
            item.idx % 13 === 0
        ) {

            const px =
                current.x;


            const py =
                current.y;


            flowerCtx.beginPath();


            flowerCtx.moveTo(
                px,
                py
            );


            flowerCtx.lineTo(
                px - 9,
                py - 8
            );


            flowerCtx.strokeStyle =
                "rgba(70,82,92,0.42)";


            flowerCtx.lineWidth =
                1.3;


            flowerCtx.stroke();


            flowerCtx.beginPath();


            flowerCtx.moveTo(
                px + 1,
                py + 3
            );


            flowerCtx.lineTo(
                px + 8,
                py - 5
            );


            flowerCtx.strokeStyle =
                "rgba(15,24,34,0.55)";


            flowerCtx.lineWidth =
                1;


            flowerCtx.stroke();
        }
    }


    /* =====================================================
       BASE
    ===================================================== */

    else if (
        item.type ===
        "base"
    ) {

        flowerCtx.save();


        flowerCtx.translate(
            item.x,
            item.y
        );


        flowerCtx.beginPath();


        flowerCtx.ellipse(
            0,
            0,
            item.w,
            item.h,
            0,
            0,
            Math.PI * 2
        );


        flowerCtx.fillStyle =
            item.color;


        flowerCtx.fill();


        flowerCtx.restore();
    }


    /* =====================================================
       PETALS / STAMENS
    ===================================================== */

    else {

        const ring =
            item;


        const x =
            cx +
            ring.distance *
            Math.cos(
                ring.angle
            );


        const y =
            cy +
            ring.distance *
            Math.sin(
                ring.angle
            );


        flowerCtx.save();


        flowerCtx.translate(
            x,
            y
        );


        flowerCtx.rotate(
            ring.angle +
            Math.PI / 2
        );


        flowerCtx.beginPath();


        flowerCtx.ellipse(
            0,
            0,
            ring.w,
            ring.h,
            0,
            0,
            Math.PI * 2
        );


        flowerCtx.strokeStyle =
            ring.color;


        flowerCtx.lineWidth =
            ring.distance < 30
            ? 7
            : 5;


        flowerCtx.shadowBlur =
            10;


        flowerCtx.shadowColor =
            "rgba(30,80,180,0.15)";


        flowerCtx.stroke();


        flowerCtx.restore();
    }


    currentIndex++;


    setTimeout(
        drawItemFromQueue,
        35
    );
}


/* =========================================================
   BLOOD
========================================================= */

let bloodDrops = [];


/*
   نستخدم نقاط صغيرة جدًا.

   كل قطرة تبدأ من إحدى البتلات
   وتنزل ببطء.
*/

function startBleeding() {

    isBleeding =
        true;


    bloodDrops = [];


    petalEndPoints.forEach(
        (end, petalIndex) => {

            /*
               7 قطرات صغيرة من كل بتلة
            */

            for (
                let i = 0;
                i < 7;
                i++
            ) {

                bloodDrops.push({

                    startX:
                        end.startX,

                    startY:
                        end.startY,


                    x:
                        end.startX,

                    y:
                        end.startY,


                    progress:
                        -i * 0.11
                        -
                        petalIndex * 0.025,


                    speed:
                        0.0025 +
                        Math.random() *
                        0.0012,


                    length:
                        45 +
                        Math.random() *
                        100,


                    size:
                        1.6 +
                        Math.random() *
                        1.7,


                    drift:
                        (
                            Math.random()
                            -
                            0.5
                        ) * 20,


                    petal:
                        petalIndex,

                    finished:
                        false
                });
            }
        }
    );


    requestAnimationFrame(
        animateBlood
    );
}


/* =========================================================
   BLOOD ANIMATION
========================================================= */

function animateBlood(time) {

    if (!isBleeding) {
        return;
    }


    /*
       نمسح طبقة الدم فقط.
    */

    bloodCtx.clearRect(
        0,
        0,
        W,
        H
    );


    let allFinished =
        true;


    for (
        const drop of bloodDrops
    ) {

        drop.progress +=
            drop.speed;


        if (
            drop.progress <
            0
        ) {

            allFinished =
                false;

            continue;
        }


        if (
            drop.progress <
            1
        ) {

            allFinished =
                false;
        }


        const p =
            Math.min(
                drop.progress,
                1
            );


        /*
           تسارع خفيف
        */

        const eased =
            p * p *
            (3 - 2 * p);


        const distance =
            eased *
            drop.length;


        /*
           حركة صغيرة يمين ويسار
        */

        drop.x =
            drop.startX
            +
            Math.sin(
                p *
                Math.PI *
                2
                +
                drop.petal
            ) *
            4
            +
            drop.drift *
            p;


        drop.y =
            drop.startY +
            distance;


        /*
           القطرة الصغيرة
        */

        bloodCtx.save();


        bloodCtx.shadowBlur =
            8;


        bloodCtx.shadowColor =
            "rgba(180,15,25,0.65)";


        const redGradient =
            bloodCtx.createRadialGradient(

                drop.x -
                drop.size * 0.3,

                drop.y -
                drop.size * 0.3,

                0.5,

                drop.x,

                drop.y,

                drop.size * 2
            );


        redGradient.addColorStop(
            0,
            "rgba(255,100,105,0.95)"
        );


        redGradient.addColorStop(
            0.35,
            "rgba(205,25,35,0.95)"
        );


        redGradient.addColorStop(
            1,
            "rgba(90,5,15,0.85)"
        );


        bloodCtx.fillStyle =
            redGradient;


        bloodCtx.beginPath();


        bloodCtx.arc(
            drop.x,
            drop.y,
            drop.size,
            0,
            Math.PI * 2
        );


        bloodCtx.fill();


        bloodCtx.restore();
    }


    if (
        allFinished
    ) {

        isBleeding =
            false;


        /*
           بعد انتهاء النزيف،
           تبدأ القطرات بالتجمع
           وتكوين الجملة.
        */

        setTimeout(
            gatherBloodIntoText,
            500
        );


        return;
    }


    requestAnimationFrame(
        animateBlood
    );
}


/* =========================================================
   CREATE TEXT PARTICLE TARGETS
========================================================= */

function createTextTargets() {

    /*
       Canvas مؤقت فقط لمعرفة
       أماكن حروف الجملة.
    */

    const temp =
        document.createElement(
            "canvas"
        );


    temp.width =
        Math.floor(W * dpr);


    temp.height =
        Math.floor(H * dpr);


    const tctx =
        temp.getContext("2d");


    tctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    const fontSize =
        Math.min(
            48,
            W * 0.095
        );


    tctx.font =
        "bold " +
        fontSize +
        "px 'Brush Script MT', 'Great Vibes', 'Comic Sans MS', cursive";


    tctx.textAlign =
        "center";


    tctx.textBaseline =
        "middle";


    const text =
        "I love u samo";


    const textY =
        cy + 160;


    /*
       رسم النص باللون الأبيض
       على canvas مؤقت.
    */

    tctx.fillStyle =
        "#ffffff";


    tctx.fillText(
        text,
        cx,
        textY
    );


    const image =
        tctx.getImageData(
            0,
            0,
            temp.width,
            temp.height
        );


    const targets = [];


    /*
       نأخذ نقاطًا من النص
    */

    const spacing =
        Math.max(
            3,
            Math.floor(
                dpr * 3
            )
        );


    for (
        let y = 0;
        y < temp.height;
        y += spacing
    ) {

        for (
            let x = 0;
            x < temp.width;
            x += spacing
        ) {

            const index =
                (
                    y *
                    temp.width +
                    x
                ) * 4;


            const alpha =
                image.data[
                    index + 3
                ];


            if (
                alpha > 100
            ) {

                targets.push({

                    x:
                        x / dpr,

                    y:
                        y / dpr
                });
            }
        }
    }


    return targets;
}


/* =========================================================
   GATHER BLOOD INTO TEXT
========================================================= */

function gatherBloodIntoText() {

    /*
       عدد كبير من النقاط
       يعطي جملة واضحة.
    */

    let targets =
        createTextTargets();


    /*
       إذا كان عدد القطرات قليلًا،
       نكرر بعض الأهداف.
    */

    const particleCount =
        Math.max(
            targets.length,
            250
        );


    const particles = [];


    for (
        let i = 0;
        i < particleCount;
        i++
    ) {

        const target =
            targets[
                i %
                targets.length
            ];


        /*
           نقطة البداية:
           تأتي من مكان إحدى قطرات الدم
           أو من أطراف الزهرة.
        */

        const source =
            petalEndPoints[
                i %
                petalEndPoints.length
            ];


        particles.push({

            x:
                source.startX,

            y:
                source.startY,


            targetX:
                target.x,

            targetY:
                target.y,


            delay:
                Math.random() *
                1800,


            duration:
                1600 +
                Math.random() *
                1300,


            size:
                1.1 +
                Math.random() *
                1.4,


            startTime:
                performance.now(),

            arrived:
                false
        });
    }


    requestAnimationFrame(
        function animateGather(now) {

            bloodCtx.clearRect(
                0,
                0,
                W,
                H
            );


            let finished =
                true;


            particles.forEach(
                particle => {

                    const elapsed =
                        now -
                        particle.startTime;


                    if (
                        elapsed <
                        particle.delay
                    ) {

                        finished =
                            false;

                        return;
                    }


                    const local =
                        Math.min(
                            (
                                elapsed -
                                particle.delay
                            ) /
                            particle.duration,
                            1
                        );


                    if (
                        local <
                        1
                    ) {

                        finished =
                            false;
                    }


                    /*
                       حركة ناعمة
                    */

                    const eased =
                        local *
                        local *
                        (
                            3 -
                            2 *
                            local
                        );


                    /*
                       مسار منحني قليلًا
                    */

                    const curve =
                        Math.sin(
                            eased *
                            Math.PI
                        ) *
                        30;


                    const x =
                        particle.x +
                        (
                            particle.targetX -
                            particle.x
                        ) *
                        eased;


                    const y =
                        particle.y +
                        (
                            particle.targetY -
                            particle.y
                        ) *
                        eased
                        -
                        curve;


                    /*
                       النقطة الحمراء
                    */

                    bloodCtx.save();


                    bloodCtx.shadowBlur =
                        9;


                    bloodCtx.shadowColor =
                        "rgba(200,20,30,0.8)";


                    bloodCtx.fillStyle =
                        "rgba(210,25,35,0.95)";


                    bloodCtx.beginPath();


                    bloodCtx.arc(
                        x,
                        y,
                        particle.size,
                        0,
                        Math.PI * 2
                    );


                    bloodCtx.fill();


                    bloodCtx.restore();
                }
            );


            if (
                finished
            ) {

                /*
                   بعد تجمع كل القطرات
                   نتركها ثابتة كجملة.
                */

                return;
            }


            requestAnimationFrame(
                animateGather
            );
        }
    );
}


/* =========================================================
   START
========================================================= */

resizeCanvas();


flowerCtx.fillStyle =
    "#05020a";


flowerCtx.fillRect(
    0,
    0,
    W,
    H
);


setTimeout(
    drawItemFromQueue,
    600
);

</script>

</body>
</html>
