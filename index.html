<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Slowly Drawn Flower</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10030f}
canvas{display:block;width:100vw;height:100vh;background:#10030f}
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");
const TAU=Math.PI*2;

let W,H,DPR,S,particles=[],start=0,raf;

function rnd(n){
  const x=Math.sin(n*127.173+41.77)*43758.5453123;
  return x-Math.floor(x);
}

function resize(){
  W=innerWidth; H=innerHeight;
  DPR=Math.min(devicePixelRatio||1,2);
  canvas.width=W*DPR; canvas.height=H*DPR;
  canvas.style.width=W+"px"; canvas.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  S=Math.min(W/1280,H/940);
}

function bezier(a,b,c,d,t){
  const u=1-t;
  return {
    x:u*u*u*a.x+3*u*u*t*b.x+3*u*t*t*c.x+t*t*t*d.x,
    y:u*u*u*a.y+3*u*u*t*b.y+3*u*t*t*c.y+t*t*t*d.y
  };
}

function add(x,y,delay,color,size,type="dot",alpha=.8){
  particles.push({
    x,y,delay,color,size,type,alpha,
    j:(rnd(particles.length*17.31)-.5)*2
  });
}

function path(fn,n,delay,step,color,size,seed,ratio=.7){
  for(let i=0;i<n;i++){
    const t=i/(n-1),p=fn(t);
    const j=(rnd(seed+i*4.73)-.5)*2.3*S;
    add(
      p.x+j,
      p.y+(rnd(seed+i*7.17)-.5)*2.3*S,
      delay+i*step,
      color,
      size*(.72+rnd(seed+i*2.41)*.62),
      rnd(seed+i*9.13)<ratio?"dot":"square",
      .42+rnd(seed+i*5.37)*.58
    );
  }
}

function G(){
  const cx=W*.5;
  return {
    cx,
    top:H*.405,
    stemBottom:H*.94,
    stem0:{x:cx+88*S,y:H*.94},
    stem1:{x:cx+45*S,y:H*.82},
    stem2:{x:cx+12*S,y:H*.65},
    stem3:{x:cx-3*S,y:H*.505}
  };
}

function make(){
  particles=[];
  const g=G();

  /*
    STEM:
    wider, dimmer, more organic and detailed.
    It is still drawn from the bottom upward.
  */
  const stem=t=>bezier(g.stem0,g.stem1,g.stem2,g.stem3,t);

  // Broad soft structural body
  path(stem,2200,0,3.8,"#187553",5.4*S,100,.68);

  // Main muted green filament
  path(stem,1900,500,4.1,"#26906a",2.45*S,200,.7);

  // Several microscopic companion traces
  for(let k=0;k<7;k++){
    path(t=>{
      const p=stem(t);
      const side=Math.sin(t*Math.PI*7+k)*(.9+k*.35)*S;
      return {x:p.x+side,y:p.y+Math.cos(t*19+k)*1.4*S};
    },650,1500+k*900,8.2,"#0d5c43",(0.55+k*.10)*S,300+k,.55);
  }

  // Fine cross fibers on the stem
  for(let k=0;k<180;k++){
    const t=rnd(500+k)*.95;
    const p=stem(t);
    const a=(rnd(700+k)-.5)*Math.PI;
    const len=(3+rnd(800+k)*8)*S;
    const n=12;
    for(let q=0;q<n;q++){
      const u=q/(n-1);
      add(
        p.x+Math.cos(a)*len*(u-.5),
        p.y+Math.sin(a)*len*(u-.5),
        1800+k*17+q*2.2,
        k%2?"#1b7052":"#287d5d",
        (.55+rnd(900+k+q)*.5)*S,
        q%3?"dot":"square",
        .28+rnd(1000+k+q)*.35
      );
    }
  }

  /*
    LEAF:
    More complete and structured, with a clear outline,
    central vein and many secondary veins.
  */
  const leafStart=8500;
  const lx=g.cx+30*S, ly=H*.68;

  function leaf(t){
    const x=lx+112*S*t;
    const y=ly-31*S*Math.sin(Math.PI*t)-5*S*Math.sin(2*Math.PI*t);
    return {x,y};
  }

  path(leaf,600,leafStart,5.2,"#197b55",2.7*S,1500,.75);
  path(leaf,420,leafStart+500,6.8,"#0c6144",1.05*S,1700,.65);

  for(let v=0;v<15;v++){
    const t=.08+v*.055;
    const p=leaf(t);
    const dir=v%2?-1:1;
    const len=(8+28*Math.sin(Math.PI*t))*S;
    path(u=>({
      x:p.x+len*u,
      y:p.y+dir*len*.40*Math.sin(Math.PI*u)
    }),70,leafStart+1600+v*120,4.5,"#116b4b",.72*S,2000+v,.7);
  }

  /*
    FLOWER:
    Organized concentric rose structure.
    Petals are generated in layers, each layer rotated evenly,
    rather than random crossing lines.
  */
  const fs=15000;
  const fx=g.cx-2*S, fy=H*.405;

  // Center spiral
  for(let c=0;c<15;c++){
    const turns=1.5+rnd(3000+c)*1.2;
    const maxR=(7+c*3.4)*S;
    path(t=>{
      const a=t*turns*TAU+c*.31;
      const r=(1.5+t*maxR);
      return {
        x:fx+Math.cos(a)*r,
        y:fy+Math.sin(a)*r*.78
      };
    },150,fs+c*230,4.4,c%2?"#e51368":"#ff2a7d",(1.0+rnd(4000+c)*1.1)*S,4000+c,.62);
  }

  // Petal layers: clean radial symmetry + organic waviness
  const layers=[
    {count:7,  rx:48,  ry:27,  rot:.12},
    {count:9,  rx:76,  ry:39,  rot:.27},
    {count:11, rx:106, ry:48,  rot:.05},
    {count:13, rx:135, ry:57,  rot:.22},
    {count:15, rx:160, ry:66,  rot:.08},
    {count:17, rx:182, ry:73,  rot:.19}
  ];

  let petalIndex=0;

  for(let L=0;L<layers.length;L++){
    const layer=layers[L];

    for(let p=0;p<layer.count;p++){
      const angle=layer.rot+p*TAU/layer.count;
      const delay=fs+2200+L*1500+p*180;

      // Outer petals are slightly longer downward/upward alternately.
      const rx=layer.rx*(.94+rnd(5000+petalIndex)*.11)*S;
      const ry=layer.ry*(.94+rnd(6000+petalIndex)*.10)*S;

      path(t=>{
        const a=t*TAU;

        // gentle organic edge, but never chaotic
        const wobble=
          1+
          .035*Math.sin(a*3+petalIndex)+
          .018*Math.sin(a*7+L)+
          .010*Math.sin(a*11+p);

        let xx=Math.cos(a)*rx*wobble;
        let yy=Math.sin(a)*ry*wobble;

        const co=Math.cos(angle),si=Math.sin(angle);
        const centerShift=(L*4.2)*S;

        return {
          x:fx+xx*co-yy*si+Math.cos(angle)*centerShift,
          y:fy+xx*si+yy*co+Math.sin(angle)*centerShift*.42
        };
      },430,delay,4.5,
      L%3===0?"#f01870":L%3===1?"#d90c62":"#ff2c7d",
      (1.0+L*.13+rnd(7000+petalIndex)*1.0)*S,
      7000+petalIndex,.72);

      // Petal inner contour, giving the flower depth.
      if(L>=1){
        path(t=>{
          const a=t*TAU;
          const rr=.68+.08*Math.sin(a*2+petalIndex);
          const xx=Math.cos(a)*rx*rr;
          const yy=Math.sin(a)*ry*rr;
          const co=Math.cos(angle),si=Math.sin(angle);
          return {
            x:fx+xx*co-yy*si+Math.cos(angle)*(L*4.2)*S,
            y:fy+xx*si+yy*co+Math.sin(angle)*(L*4.2)*S*.42
          };
        },260,delay+650,5.9,"#a90b57",.72*S,9000+petalIndex,.65);
      }

      petalIndex++;
    }
  }

  /*
    Fine petal veins: they follow each petal's radial direction.
    This creates complexity while preserving order.
  */
  for(let v=0;v<92;v++){
    const a=v*TAU/92+(rnd(12000+v)-.5)*.025;
    const r0=(20+rnd(13000+v)*55)*S;
    const r1=(105+rnd(14000+v)*82)*S;

    path(t=>{
      const r=r0+(r1-r0)*t;
      const wave=Math.sin(t*Math.PI*3+v)*2.0*S;
      return {
        x:fx+Math.cos(a)*r+Math.cos(a+Math.PI/2)*wave,
        y:fy+Math.sin(a)*r*.57+Math.sin(a+Math.PI/2)*wave*.57
      };
    },100,fs+9000+v*65,4.0,
      v%3?"#c20b5d":"#ff3c87",
      .62*S,15000+v,.76);
  }

  /*
    Tiny decorative dots around the flower edges.
  */
  for(let q=0;q<1200;q++){
    const a=rnd(18000+q)*TAU;
    const r=(90+rnd(19000+q)*105)*S;
    const yScale=.48+rnd(20000+q)*.13;

    add(
      fx+Math.cos(a)*r,
      fy+Math.sin(a)*r*yScale,
      fs+11500+q*8,
      q%3?"#e71970":"#ff3985",
      (.45+rnd(21000+q)*1.0)*S,
      q%4?"dot":"square",
      .16+rnd(22000+q)*.40
    );
  }

  particles.sort((a,b)=>a.delay-b.delay);
}

function draw(p){
  ctx.globalAlpha=p.alpha;
  const x=p.x+Math.sin(p.j)*.15*S;
  const y=p.y+Math.cos(p.j)*.15*S;

  if(p.type==="square"){
    ctx.fillStyle=p.color;
    ctx.fillRect(x-p.size/2,y-p.size/2,p.size,p.size);
  }else{
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(x,y,p.size/2,0,TAU);
    ctx.fill();
  }
}

function render(now){
  ctx.fillStyle="#10030f";
  ctx.fillRect(0,0,W,H);

  const elapsed=now-start;

  /*
    Faster than the previous version, but still clearly hand-drawn.
    Particles appear in small streams rather than instant lines.
  */
  for(const p of particles){
    const a=(elapsed-p.delay)/48;
    if(a>0) draw(p);
  }

  ctx.globalAlpha=1;

  const last=particles[particles.length-1]?.delay||0;

  if(elapsed>last+6000){
    start=now;
  }

  raf=requestAnimationFrame(render);
}

function restart(){
  cancelAnimationFrame(raf);
  make();
  start=performance.now();
  raf=requestAnimationFrame(render);
}

canvas.addEventListener("click",restart);

addEventListener("resize",()=>{
  resize();
  restart();
});

resize();
restart();
</script>
</body>
</html>
