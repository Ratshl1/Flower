<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Blue Lily</title>

<style>

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #05020a;

    touch-action: none;
}

#scene {
    position: relative;

    width: 100vw;
    height: 100vh;

    overflow: hidden;
}

canvas {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    display: block;

    pointer-events: none;
}

#flowerCanvas {
    z-index: 1;
}

#bloodCanvas {
    z-index: 2;
}

</style>

</head>


<body>


<!-- =====================================================
     ROMANTIC MUSIC
===================================================== -->

<audio id="romanticMusic"
       src="Romantic.mp4"
       loop
       preload="auto"
       playsinline>
</audio>


<div id="scene">

    <canvas id="flowerCanvas"></canvas>
    <canvas id="bloodCanvas"></canvas>

</div>


<script>

/* =========================================================
   ROMANTIC MUSIC
========================================================= */

const romanticMusic =
    document.getElementById("romanticMusic");


/*
   Very quiet romantic volume.
   0.20 = 20%
*/

romanticMusic.volume = 0.20;


/*
   Try to start immediately
   when the website opens.
*/

function startMusic() {

    romanticMusic.play()
        .catch(() => {

            /*
               Some mobile browsers block
               autoplay until the user interacts.
            */

        });
}


/*
   First attempt.
*/

startMusic();


/*
   If autoplay is blocked,
   start music on the first touch.
*/

function enableMusicAfterInteraction() {

    romanticMusic.play()
        .catch(() => {});

}


/*
   Touch on mobile.
*/

document.addEventListener(
    "touchstart",
    enableMusicAfterInteraction,
    {
        once: true,
        passive: true
    }
);


/*
   Click on desktop.
*/

document.addEventListener(
    "click",
    enableMusicAfterInteraction,
    {
        once: true
    }
);


/* =========================================================
   CANVAS
========================================================= */

const flowerCanvas =
    document.getElementById("flowerCanvas");

const bloodCanvas =
    document.getElementById("bloodCanvas");

const flowerCtx =
    flowerCanvas.getContext("2d");

const bloodCtx =
    bloodCanvas.getContext("2d");


/* =========================================================
   VARIABLES
========================================================= */

let W;
let H;

let cx;
let cy;

let dpr;

let drawQueue = [];

let currentIndex = 0;

let petalEndPoints = [];

let stemPoints = [];

let leaves = [];

let isDrawingFlower = true;

let isBleeding = false;

let drops = [];

let textTargets = [];


/* =========================================================
   RESIZE
========================================================= */

function resizeCanvas() {

    W = window.innerWidth;
    H = window.innerHeight;

    dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    flowerCanvas.width =
        Math.floor(W * dpr);

    flowerCanvas.height =
        Math.floor(H * dpr);

    bloodCanvas.width =
        Math.floor(W * dpr);

    bloodCanvas.height =
        Math.floor(H * dpr);


    flowerCanvas.style.width =
        W + "px";

    flowerCanvas.style.height =
        H + "px";

    bloodCanvas.style.width =
        W + "px";

    bloodCanvas.style.height =
        H + "px";


    flowerCtx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    bloodCtx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    cx = W / 2;

    cy = H * 0.42;


    buildFlower();
}


/* =========================================================
   BUILD FLOWER
========================================================= */

function buildFlower() {

    drawQueue = [];

    currentIndex = 0;

    petalEndPoints = [];

    leaves = [];


    const MAX_RADIUS =
        Math.min(W, H) * 0.35;


    const CENTER_GAP =
        Math.min(
            115,
            H * 0.15
        );


    /* =====================================================
       STEM
    ===================================================== */

    function generateStemPoints() {

        const points = [];

        const steps = 190;


        const startY =
            Math.min(
                H - 12,
                cy + 390
            );


        const endY =
            cy +
            CENTER_GAP -
            8;


        const startX =
            cx + 15;


        const endX =
            cx;


        for (
            let i = 0;
            i <= steps;
            i++
        ) {

            const t =
                i / steps;


            const curve =
                Math.sin(
                    t * Math.PI
                ) * 22;


            const x =
                startX +
                (endX - startX) * t
                -
                curve;


            const y =
                startY +
                (endY - startY) * t;


            points.push({
                x,
                y
            });
        }


        return points;
    }


    stemPoints =
        generateStemPoints();


    /* =====================================================
       ONLY TWO UPPER LEAVES
    ===================================================== */

    leaves = [

        {
            stemIndex: 55,
            side: -1,
            length: 68,
            width: 27,
            angle: -0.48
        },

        {
            stemIndex: 105,
            side: 1,
            length: 76,
            width: 29,
            angle: 0.46
        }

    ];


    /*
       STEM DRAW QUEUE
    */

    for (
        let i = 1;
        i < stemPoints.length;
        i++
    ) {

        drawQueue.push({
            type: "stem",
            idx: i
        });
    }


    /* =====================================================
       FLOWER BASE
    ===================================================== */

    for (
        let i = 0;
        i < 100;
        i++
    ) {

        const t =
            i / 99;


        const yOffset =
            CENTER_GAP -
            t * 42;


        const xOffset =
            -17 +
            t * 34;


        drawQueue.push({

            type: "base",

            x:
                cx +
                xOffset,

            y:
                cy +
                yOffset,

            w:
                16 +
                t * 28,

            h:
                11 +
                t * 17,

            color:
                `rgba(
                    20,
                    25,
                    55,
                    ${0.45 -
                    t * 0.18}
                )`
        });
    }


    /* =====================================================
       PETALS
    ===================================================== */

    const lilyPetals = [];

    const numPetals = 6;

    const ringsPerPetal = 135;


    for (
        let p = 0;
        p < numPetals;
        p++
    ) {

        const petalAngle =
            (
                p / numPetals
            ) *
            Math.PI *
            2;


        let finalX = cx;

        let finalY = cy;


        for (
            let j = 0;
            j < ringsPerPetal;
            j++
        ) {

            const t =
                j /
                (ringsPerPetal - 1);


            const distance =
                5 +
                t *
                MAX_RADIUS;


            const angleOffset =
                Math.sin(
                    j * 0.018 +
                    p * 1.7
                )
                *
                0.12 *
                t;


            const angle =
                petalAngle +
                angleOffset;


            const shape =
                Math.sin(
                    t * Math.PI
                );


            const w =
                10 +
                shape * 25;


            const h =
                15 +
                shape * 30;


            let alpha =
                0.28 -
                t * 0.20;


            alpha =
                Math.max(
                    0.025,
                    alpha
                );


            let r =
                30 +
                t * 50;


            let g =
                30 +
                t * 60;


            let b =
                100 +
                t * 80;


            const fade =
                Math.pow(
                    t,
                    2.5
                );


            r =
                r * (1 - fade)
                +
                5 * fade;


            g =
                g * (1 - fade)
                +
                5 * fade;


            b =
                b * (1 - fade)
                +
                5 * fade;


            lilyPetals.push({

                distance,

                angle,

                w,

                h,

                color:
                    `rgba(
                        ${Math.floor(r)},
                        ${Math.floor(g)},
                        ${Math.floor(b)},
                        ${alpha}
                    )`
            });


            finalX =
                cx +
                distance *
                Math.cos(angle);


            finalY =
                cy +
                distance *
                Math.sin(angle);
        }


        petalEndPoints.push({

            startX:
                finalX,

            startY:
                finalY,

            angle:
                petalAngle
        });
    }


    lilyPetals.sort(
        (a, b) =>
            a.distance -
            b.distance
    );


    drawQueue =
        drawQueue.concat(
            lilyPetals
        );


    /* =====================================================
       STAMENS
    ===================================================== */

    const stamens = [];


    for (
        let s = 0;
        s < 6;
        s++
    ) {

        const angle =
            (
                s / 6
            ) *
            Math.PI *
            2
            +
            0.2;


        for (
            let j = 0;
            j < 35;
            j++
        ) {

            const dist =
                10 +
                j * 2.2;


            if (
                dist >
                MAX_RADIUS * 0.65
            ) {
                break;
            }


            stamens.push({

                distance:
                    dist,

                angle,

                w: 2,

                h:
                    j < 30
                    ? 4
                    : 12,

                color:
                    j < 30
                    ?
                    `rgba(
                        200,
                        190,
                        230,
                        ${0.25 -
                        (j / 35) *
                        0.15}
                    )`
                    :
                    "rgba(255,255,255,0.3)"
            });
        }
    }


    stamens.sort(
        (a, b) =>
            a.distance -
            b.distance
    );


    drawQueue =
        drawQueue.concat(
            stamens
        );
}


/* =========================================================
   DRAW STEM SEGMENT
========================================================= */

function drawStemSegment(idx) {

    const previous =
        stemPoints[idx - 1];

    const current =
        stemPoints[idx];


    /* MAIN STEM */

    flowerCtx.beginPath();


    flowerCtx.moveTo(
        previous.x,
        previous.y
    );


    flowerCtx.lineTo(
        current.x,
        current.y
    );


    flowerCtx.strokeStyle =
        "rgba(35,65,45,0.98)";


    flowerCtx.lineWidth =
        9;


    flowerCtx.lineCap =
        "round";


    flowerCtx.shadowBlur =
        4;


    flowerCtx.shadowColor =
        "rgba(30,100,60,0.25)";


    flowerCtx.stroke();


    /* INNER DETAIL */

    flowerCtx.beginPath();


    flowerCtx.moveTo(
        previous.x - 1.5,
        previous.y
    );


    flowerCtx.lineTo(
        current.x - 1.5,
        current.y
    );


    flowerCtx.strokeStyle =
        "rgba(105,145,95,0.38)";


    flowerCtx.lineWidth =
        2;


    flowerCtx.stroke();


    /* SMALL DETAILS */

    if (
        idx % 10 === 0
    ) {

        flowerCtx.beginPath();


        flowerCtx.arc(
            current.x,
            current.y,
            1.5,
            0,
            Math.PI * 2
        );


        flowerCtx.fillStyle =
            "rgba(120,155,105,0.32)";


        flowerCtx.fill();
    }


    /*
       Grow the leaves exactly
       when the stem reaches them.
    */

    for (
        const leaf of leaves
    ) {

        if (
            idx === leaf.stemIndex
        ) {

            animateLeaf(
                leaf
            );
        }
    }
}


/* =========================================================
   ANIMATED LEAF
========================================================= */

function animateLeaf(leaf) {

    const connection =
        stemPoints[
            leaf.stemIndex
        ];


    const startX =
        connection.x;


    const startY =
        connection.y;


    let progress = 0;


    function grow() {

        progress += 0.028;


        if (
            progress > 1
        ) {

            progress = 1;
        }


        drawLeaf(
            startX,
            startY,
            leaf.angle,
            leaf.length *
                progress,
            leaf.width *
                progress
        );


        if (
            progress < 1
        ) {

            requestAnimationFrame(
                grow
            );
        }
    }


    grow();
}


/* =========================================================
   DRAW LEAF
========================================================= */

function drawLeaf(
    x,
    y,
    angle,
    length,
    width
) {

    flowerCtx.save();


    /*
       Connection point is the stem itself.
    */

    flowerCtx.translate(
        x,
        y
    );


    flowerCtx.rotate(
        angle
    );


    /* =====================================================
       PALE LEAF
    ===================================================== */

    flowerCtx.beginPath();


    flowerCtx.moveTo(
        0,
        0
    );


    flowerCtx.bezierCurveTo(
        length * 0.25,
        -width,
        length * 0.72,
        -width * 0.85,
        length,
        0
    );


    flowerCtx.bezierCurveTo(
        length * 0.72,
        width * 0.85,
        length * 0.25,
        width,
        0,
        0
    );


    /*
       Same color family as the stem.
       Very subtle and transparent.
    */

    const gradient =
        flowerCtx.createLinearGradient(
            0,
            0,
            length,
            0
        );


    gradient.addColorStop(
        0,
        "rgba(35,65,45,0.58)"
    );


    gradient.addColorStop(
        0.45,
        "rgba(55,85,55,0.40)"
    );


    gradient.addColorStop(
        1,
        "rgba(35,65,45,0.20)"
    );


    flowerCtx.fillStyle =
        gradient;


    flowerCtx.shadowBlur =
        2;


    flowerCtx.shadowColor =
        "rgba(40,80,45,0.12)";


    flowerCtx.fill();


    /* =====================================================
       MAIN VEIN
    ===================================================== */

    flowerCtx.beginPath();


    flowerCtx.moveTo(
        0,
        0
    );


    flowerCtx.quadraticCurveTo(
        length * 0.45,
        -2,
        length,
        0
    );


    flowerCtx.strokeStyle =
        "rgba(105,135,90,0.30)";


    flowerCtx.lineWidth =
        1.3;


    flowerCtx.stroke();


    /* =====================================================
       FAINT LEAF VEINS
    ===================================================== */

    for (
        let i = 0.20;
        i < 0.88;
        i += 0.16
    ) {

        const px =
            length * i;


        const h =
            width *
            Math.sin(
                i * Math.PI
            );


        flowerCtx.beginPath();


        flowerCtx.moveTo(
            px,
            0
        );


        flowerCtx.lineTo(
            px - 8,
            -h * 0.65
        );


        flowerCtx.strokeStyle =
            "rgba(115,145,95,0.16)";


        flowerCtx.lineWidth =
            0.8;


        flowerCtx.stroke();


        flowerCtx.beginPath();


        flowerCtx.moveTo(
            px,
            0
        );


        flowerCtx.lineTo(
            px - 8,
            h * 0.65
        );


        flowerCtx.stroke();
    }


    flowerCtx.restore();
}


/* =========================================================
   DRAW FLOWER CONNECTION
========================================================= */

function drawFlowerConnection() {

    const top =
        stemPoints[
            stemPoints.length - 1
        ];


    flowerCtx.save();


    flowerCtx.beginPath();


    flowerCtx.moveTo(
        top.x,
        top.y
    );


    flowerCtx.bezierCurveTo(

        top.x - 5,
        top.y - 20,

        cx - 18,
        cy + 92,

        cx,
        cy + 72
    );


    flowerCtx.strokeStyle =
        "rgba(38,75,45,0.95)";


    flowerCtx.lineWidth =
        13;


    flowerCtx.lineCap =
        "round";


    flowerCtx.stroke();


    flowerCtx.restore();
}


/* =========================================================
   DRAW ITEM
========================================================= */

function drawItemFromQueue() {

    if (
        !isDrawingFlower
    ) {
        return;
    }


    if (
        currentIndex >=
        drawQueue.length
    ) {

        isDrawingFlower =
            false;


        drawFlowerConnection();


        setTimeout(
            startBleeding,
            900
        );


        return;
    }


    const item =
        drawQueue[
            currentIndex
        ];


    /* STEM */

    if (
        item.type ===
        "stem"
    ) {

        drawStemSegment(
            item.idx
        );
    }


    /* BASE */

    else if (
        item.type ===
        "base"
    ) {

        flowerCtx.save();


        flowerCtx.translate(
            item.x,
            item.y
        );


        flowerCtx.beginPath();


        flowerCtx.ellipse(
            0,
            0,
            item.w,
            item.h,
            0,
            0,
            Math.PI * 2
        );


        flowerCtx.fillStyle =
            item.color;


        flowerCtx.fill();


        flowerCtx.restore();
    }


    /* PETALS / STAMENS */

    else {

        const ring =
            item;


        const x =
            cx +
            ring.distance *
            Math.cos(
                ring.angle
            );


        const y =
            cy +
            ring.distance *
            Math.sin(
                ring.angle
            );


        flowerCtx.save();


        flowerCtx.translate(
            x,
            y
        );


        flowerCtx.rotate(
            ring.angle +
            Math.PI / 2
        );


        flowerCtx.beginPath();


        flowerCtx.ellipse(
            0,
            0,
            ring.w,
            ring.h,
            0,
            0,
            Math.PI * 2
        );


        flowerCtx.strokeStyle =
            ring.color;


        flowerCtx.lineWidth =
            ring.distance < 30
            ? 7
            : 5;


        flowerCtx.shadowBlur =
            10;


        flowerCtx.shadowColor =
            "rgba(30,80,180,0.15)";


        flowerCtx.stroke();


        flowerCtx.restore();
    }


    currentIndex++;


    /*
       Gradual drawing speed.
    */

    const stage =
        Math.floor(
            currentIndex / 120
        );


    const delay =
        Math.max(
            25,
            52 -
            stage * 3
        );


    setTimeout(
        drawItemFromQueue,
        delay
    );
}


/* =========================================================
   CREATE TEXT TARGETS
========================================================= */

function createTextTargets() {

    const offscreen =
        document.createElement(
            "canvas"
        );


    const scale = 3;


    offscreen.width =
        Math.floor(
            W * scale
        );


    offscreen.height =
        Math.floor(
            H * scale
        );


    const tctx =
        offscreen.getContext(
            "2d"
        );


    tctx.scale(
        scale,
        scale
    );


    const fontSize =
        Math.min(
            48,
            W * 0.105
        );


    tctx.font =
        `bold ${fontSize}px
         "Trebuchet MS",
         Arial,
         sans-serif`;


    tctx.textAlign =
        "center";


    tctx.textBaseline =
        "middle";


    const textY =
        cy + 270;


    tctx.fillStyle =
        "white";


    tctx.fillText(
        "I love u samo",
        cx,
        textY
    );


    const image =
        tctx.getImageData(
            0,
            0,
            offscreen.width,
            offscreen.height
        );


    const result = [];

    const spacing = 3;


    for (
        let y = 0;
        y < H;
        y += spacing
    ) {

        for (
            let x = 0;
            x < W;
            x += spacing
        ) {

            const px =
                Math.floor(
                    x * scale
                );


            const py =
                Math.floor(
                    y * scale
                );


            const index =
                (
                    py *
                    offscreen.width +
                    px
                ) * 4;


            if (
                image.data[
                    index + 3
                ] > 100
            ) {

                result.push({

                    x,

                    y
                });
            }
        }
    }


    return result;
}


/* =========================================================
   START BLEEDING
========================================================= */

function startBleeding() {

    isBleeding =
        true;


    bloodCtx.clearRect(
        0,
        0,
        W,
        H
    );


    textTargets =
        createTextTargets();


    drops = [];


    /*
       Large number of tiny drops
       to form clear letters.
    */

    const amount =
        Math.min(
            textTargets.length,
            2600
        );


    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const source =
            petalEndPoints[
                i %
                petalEndPoints.length
            ];


        const target =
            textTargets[i];


        drops.push({

            startX:
                source.startX +
                (
                    Math.random() -
                    0.5
                ) * 10,

            startY:
                source.startY +
                (
                    Math.random() -
                    0.5
                ) * 10,


            x:
                source.startX,

            y:
                source.startY,


            targetX:
                target.x,

            targetY:
                target.y,


            progress:
                -(
                    i * 0.002
                ),


            speed:
                0.0017 +
                Math.random() *
                0.0007,


            size:
                0.85 +
                Math.random() *
                1.15
        });
    }


    requestAnimationFrame(
        animateBlood
    );
}


/* =========================================================
   BLOOD ANIMATION
========================================================= */

function animateBlood() {

    if (
        !isBleeding
    ) {
        return;
    }


    bloodCtx.clearRect(
        0,
        0,
        W,
        H
    );


    let finished =
        true;


    for (
        const drop of drops
    ) {

        drop.progress +=
            drop.speed;


        if (
            drop.progress < 0
        ) {

            finished =
                false;

            continue;
        }


        if (
            drop.progress < 1
        ) {

            finished =
                false;
        }


        const p =
            Math.min(
                drop.progress,
                1
            );


        const eased =
            p < 0.5

            ?

            2 * p * p

            :

            1 -
            Math.pow(
                -2 * p + 2,
                2
            ) / 2;


        drop.x =
            drop.startX +
            (
                drop.targetX -
                drop.startX
            ) *
            eased;


        drop.y =
            drop.startY +
            (
                drop.targetY -
                drop.startY
            ) *
            eased;


        bloodCtx.save();


        bloodCtx.shadowBlur =
            8;


        bloodCtx.shadowColor =
            "rgba(35,125,255,0.65)";


        bloodCtx.fillStyle =
            "rgba(50,145,255,0.94)";


        bloodCtx.beginPath();


        bloodCtx.arc(
            drop.x,
            drop.y,
            drop.size,
            0,
            Math.PI * 2
        );


        bloodCtx.fill();


        bloodCtx.restore();
    }


    if (
        finished
    ) {

        isBleeding =
            false;


        emphasizeFinalLetters();


        return;
    }


    requestAnimationFrame(
        animateBlood
    );
}


/* =========================================================
   FINAL TEXT
========================================================= */

function emphasizeFinalLetters() {

    let pulse = 0;


    function animateGlow() {

        pulse += 0.035;


        bloodCtx.clearRect(
            0,
            0,
            W,
            H
        );


        for (
            const drop of drops
        ) {

            const glow =
                7 +
                Math.sin(
                    pulse
                ) * 2;


            bloodCtx.save();


            bloodCtx.shadowBlur =
                glow;


            bloodCtx.shadowColor =
                "rgba(35,130,255,0.9)";


            bloodCtx.fillStyle =
                "rgba(55,155,255,0.98)";


            bloodCtx.beginPath();


            bloodCtx.arc(
                drop.targetX,
                drop.targetY,
                drop.size * 1.05,
                0,
                Math.PI * 2
            );


            bloodCtx.fill();


            bloodCtx.restore();
        }


        requestAnimationFrame(
            animateGlow
        );
    }


    animateGlow();
}


/* =========================================================
   START
========================================================= */

resizeCanvas();


flowerCtx.fillStyle =
    "#05020a";


flowerCtx.fillRect(
    0,
    0,
    W,
    H
);


setTimeout(
    drawItemFromQueue,
    800
);


/*
   Prevent accidental redraw
   on resize.
*/

window.addEventListener(
    "resize",
    () => {

    }
);

</script>
