<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الزنبقة الزرقاء الغامضة</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #020105; /* خلفية سوداء مائلة للزرقة العميقة */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
            background-color: #020105;
        }
    </style>
</head>
<body>
    <canvas id="flowerCanvas"></canvas>

    <script>
        const canvas = document.getElementById('flowerCanvas');
        const ctx = canvas.getContext('2d');

        // ضبط حجم اللوحة
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        let drawQueue = [];
        let currentIndex = 0;

        // -----------------------------------------
        // 1. الساق الطويلة (Stem)
        // -----------------------------------------
        function generateStemPoints() {
            const points = [];
            const steps = 100;
            for (let i = 0; i <= steps; i++) {
                let t = i / steps;
                let x = cx + 2 - (t * 15); // انحناء بسيط للساق
                let y = cy + 130 + (t * 200) + (Math.sin(t * 2) * 10);
                points.push({x, y});
            }
            return points;
        }

        const stemPoints = generateStemPoints();
        for (let i = 0; i < stemPoints.length; i++) {
            drawQueue.push({ type: 'stem', idx: i });
        }

        // -----------------------------------------
        // 2. أوراق الساق الرفيعة (Leaves)
        // -----------------------------------------
        function generateLeaves() {
            const leaves = [];
            // ورقة 1 (يسار)
            for(let i=0; i<40; i++) {
                let t = i / 40;
                leaves.push({ type: 'leaf', x: cx - 15 - (t*30), y: cy + 180 + (t*80), w: 4 + t*8, h: 2 + t*14, angle: -0.2, color: `rgba(30, 50, 70, ${0.3 - t*0.2})` });
            }
            // ورقة 2 (يمين)
            for(let i=0; i<35; i++) {
                let t = i / 35;
                leaves.push({ type: 'leaf', x: cx + 10 + (t*20), y: cy + 230 + (t*70), w: 4 + t*7, h: 2 + t*12, angle: 0.4, color: `rgba(20, 40, 60, ${0.25 - t*0.15})` });
            }
            return leaves;
        }
        drawQueue = drawQueue.concat(generateLeaves());

        // -----------------------------------------
        // 3. الحلقات الداخلية للزنبقة (كبسولة القمع)
        // -----------------------------------------
        function generateLilyBase() {
            const loops = [];
            for (let i = 0; i < 60; i++) {
                let t = i / 60;
                let dist = 5 + t * 40;
                let angle = Math.random() * 2 * Math.PI;
                let w = 10 + t * 20;
                let h = 10 + t * 20;
                loops.push({ 
                    distance: dist, angle: angle, w: w, h: h, 
                    color: `rgba(15, 20, 40, ${0.4 - t * 0.2})` 
                });
            }
            return loops;
        }
        drawQueue = drawQueue.concat(generateLilyBase());

        // -----------------------------------------
        // 4. بتلات الزنبقة (Lily Petals) - 6 بتلات أنبوبية
        // -----------------------------------------
        const lilyPetals = [];
        const numPetals = 6;
        const ringsPerPetal = 120;

        for (let p = 0; p < numPetals; p++) {
            let petalAngle = (p / numPetals) * 2 * Math.PI;
            for (let j = 0; j < ringsPerPetal; j++) {
                let t = j / ringsPerPetal;
                let distance = 10 + j * 3.8; // بتلة طويلة ممتدة
                let angleOffset = Math.sin(j * 0.02) * 0.25; // انحناء البتلة للخارج
                let angle = petalAngle + angleOffset;
                
                // شكل البتلة الأنبوبي: عرض ثابت، طول متزايد
                let w = 20 + t * 15; 
                let h = 25 + t * 25; 
                
                // ألوان زرقاء باهتة جداً وغامضة
                let alpha = 0.25 - (j / ringsPerPetal) * 0.20;
                alpha = Math.max(0.02, alpha);
                
                // تدرج الألوان: قلب أزرق داكن، أطراف أزرق سماوي باهت
                let r = 50 + t * 100;
                let g = 60 + t * 140;
                let b = 180 + t * 80;
                
                let color = `rgba(${r}, ${g}, ${b}, ${alpha})`;
                
                lilyPetals.push({ distance, angle, w, h, color });
            }
        }
        lilyPetals.sort((a, b) => a.distance - b.distance);
        drawQueue = drawQueue.concat(lilyPetals);

        // -----------------------------------------
        // 5. الأسدية (Stamens) - سمة الزنبق المميزة
        // -----------------------------------------
        const stamens = [];
        for (let s = 0; s < 6; s++) {
            let stamenAngle = (s / 6) * 2 * Math.PI;
            for (let j = 0; j < 30; j++) {
                let dist = 10 + j * 2.5;
                let color = j < 28 ? 
                    `rgba(130, 110, 70, ${0.3 - (j/30)*0.2})` : // خيوط السداة (لون نحاسي قديم)
                    `rgba(200, 180, 100, 0.4)`; // متك السداة (طرفها)
                stamens.push({ distance: dist, angle: stamenAngle, w: 2, h: j < 28 ? 4 : 10, color });
            }
        }
        stamens.sort((a, b) => a.distance - b.distance);
        drawQueue = drawQueue.concat(stamens);

        // -----------------------------------------
        // 6. إعدادات الرسم البطيء والطابع الغامض
        // -----------------------------------------
        ctx.lineWidth = 3.0;
        ctx.shadowBlur = 15; // توهج غامض
        ctx.shadowColor = 'rgba(30, 40, 80, 0.3)'; // ظل أزرق داكن

        const DRAW_DELAY_MS = 45; // سرعة بطيئة جداً

        function drawItemFromQueue() {
            if (currentIndex >= drawQueue.length) return;

            const item = drawQueue[currentIndex];

            if (item.type === 'stem') {
                ctx.beginPath();
                ctx.moveTo(stemPoints[Math.max(0, item.idx - 1)].x, stemPoints[Math.max(0, item.idx - 1)].y);
                ctx.lineTo(stemPoints[item.idx].x, stemPoints[item.idx].y);
                ctx.strokeStyle = 'rgba(25, 40, 50, 0.6)';
                ctx.lineWidth = 5;
                ctx.shadowBlur = 0;
                ctx.stroke();
                ctx.shadowBlur = 15;
            } 
            else if (item.type === 'leaf') {
                ctx.save();
                ctx.translate(item.x, item.y);
                ctx.rotate(item.angle);
                ctx.beginPath();
                ctx.ellipse(0, 0, item.w, item.h, 0, 0, Math.PI * 2);
                ctx.fillStyle = item.color;
                ctx.lineWidth = 2;
                ctx.fill();
                ctx.restore();
            } 
            else {
                // رسم حلقات الزنبقة والأسدية
                const ring = item;
                const x = cx + ring.distance * Math.cos(ring.angle);
                const y = cy + ring.distance * Math.sin(ring.angle);
                
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(ring.angle + Math.PI / 2);
                
                ctx.beginPath();
                ctx.ellipse(0, 0, ring.w, ring.h, 0, 0, Math.PI * 2);
                ctx.strokeStyle = ring.color;
                ctx.lineWidth = ring.distance < 15 ? 5 : 3; // ضربات سميكة في القمع الداخلي
                ctx.stroke();
                
                ctx.restore();
            }

            currentIndex++;
            setTimeout(drawItemFromQueue, DRAW_DELAY_MS);
        }

        // رسم الخلفية وتشغيل الأنيميشن
        ctx.fillStyle = '#020105';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        setTimeout(drawItemFromQueue, 500);

    </script>
</body>
</html>
