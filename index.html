<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الزنبقة الزرقاء - نزيف ورسالة نيون</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #05020a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            touch-action: none;
        }
        canvas {
            display: block;
            background-color: #05020a;
        }
    </style>
</head>
<body>
    <canvas id="flowerCanvas"></canvas>

    <script>
        const canvas = document.getElementById('flowerCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        let drawQueue = [];
        let currentIndex = 0;
        let petalEndPoints = [];

        let isDrawingFlower = true;
        let isBleeding = false;
        let bleedStep = 0;

        const MAX_RADIUS = Math.min(canvas.width, canvas.height) * 0.35; 
        const CENTER_GAP = 130; 

        // -----------------------------------------
        // 1. توليد الساق المتصلة
        // -----------------------------------------
        function generateStemPoints() {
            const points = [];
            const steps = 120;
            const startY = cy + 350; 
            const startX = cx + 20; 
            for (let i = 0; i <= steps; i++) {
                let t = i / steps;
                let x = startX - (t * 22); 
                let y = startY - (t * (350 - CENTER_GAP)); 
                points.push({x, y});
            }
            return points;
        }

        const stemPoints = generateStemPoints();
        for (let i = 0; i < stemPoints.length; i++) {
            drawQueue.push({ type: 'stem', idx: i });
        }

        // -----------------------------------------
        // 2. قاعدة الزهرة (القمع)
        // -----------------------------------------
        function generateReceptacle() {
            const loops = [];
            for (let i = 0; i < 80; i++) {
                let t = i / 80;
                let yOffset = CENTER_GAP - (t * 40); 
                let xOffset = -15 + (t * 30);
                let w = 15 + t * 25;
                let h = 10 + t * 15;
                let color = `rgba(20, 25, 45, ${0.4 - t * 0.15})`;
                loops.push({ type: 'base', x: cx + xOffset, y: cy + yOffset, w, h, angle: 0, color });
            }
            return loops;
        }
        drawQueue = drawQueue.concat(generateReceptacle());

        // -----------------------------------------
        // 3. بتلات الزهرة (ألوان زرقاء وأطراف سوداء)
        // -----------------------------------------
        const lilyPetals = [];
        const numPetals = 6;
        const ringsPerPetal = 120;

        // *** إضافة نقاط نهاية البتلات للدم ***
        for (let p = 0; p < numPetals; p++) {
            let petalAngle = (p / numPetals) * 2 * Math.PI;
            for (let j = 0; j < ringsPerPetal; j++) {
                let t = j / ringsPerPetal;
                let distance = 5 + (t * MAX_RADIUS);
                if (distance > MAX_RADIUS) break; 
                let angleOffset = Math.sin(j * 0.02) * 0.3; 
                let angle = petalAngle + angleOffset;
                
                let shapeFactor = Math.sin(t * Math.PI); 
                let w = 10 + shapeFactor * 25; 
                let h = 15 + shapeFactor * 30; 
                
                let alpha = 0.25 - (t * 0.20); 
                alpha = Math.max(0.02, alpha);
                
                let r = 30 + t * 50;
                let g = 30 + t * 60;
                let b = 100 + t * 80;
                
                let fadeToBlack = Math.pow(t, 2.5);
                r = r * (1 - fadeToBlack) + 5 * fadeToBlack;
                g = g * (1 - fadeToBlack) + 5 * fadeToBlack;
                b = b * (1 - fadeToBlack) + 5 * fadeToBlack;
                
                let color = `rgba(${Math.floor(r)}, ${Math.floor(g)}, ${Math.floor(b)}, ${alpha})`;
                lilyPetals.push({ distance, angle, w, h, color });

                // **تخزين الطرف الخارجي للبتلة (لنزول الدم)**
                if (j === ringsPerPetal - 1) {
                    let endX = cx + distance * Math.cos(angle);
                    let endY = cy + distance * Math.sin(angle);
                    // إضافة تفرقة بسيطة بحيث لا تتراكم كل القطرات في نقطة واحدة
                    petalEndPoints.push({ 
                        startX: endX, 
                        startY: endY + 10, 
                        angle: petalAngle 
                    });
                }
            }
        }
        lilyPetals.sort((a, b) => a.distance - b.distance);
        drawQueue = drawQueue.concat(lilyPetals);

        // -----------------------------------------
        // 4. الأسدية البيضاء (فوق الأزرق)
        // -----------------------------------------
        const stamens = [];
        for (let s = 0; s < 6; s++) {
            let stamenAngle = (s / 6) * 2 * Math.PI + 0.2;
            for (let j = 0; j < 35; j++) {
                let dist = 10 + j * 2.2;
                if (dist > MAX_RADIUS * 0.65) break;
                let color = j < 30 ? 
                    `rgba(200, 190, 230, ${0.25 - (j/35)*0.15})` : 
                    `rgba(255, 255, 255, 0.3)`;
                stamens.push({ distance: dist, angle: stamenAngle, w: 2, h: j < 30 ? 4 : 12, color });
            }
        }
        stamens.sort((a, b) => a.distance - b.distance);
        drawQueue = drawQueue.concat(stamens);

        // -----------------------------------------
        // 5. إعدادات الرسم البطيء للزهرة
        // -----------------------------------------
        ctx.lineWidth = 5.5;
        ctx.shadowBlur = 12; 
        ctx.shadowColor = 'rgba(30, 20, 60, 0.2)'; 

        const DRAW_DELAY_MS = 55;

        ctx.fillStyle = '#05020a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // ============================================
        // مرحلة النزيف (تسيل بسلاسة ووضوح من الأطراف)
        // ============================================
        function startBleeding() {
            isDrawingFlower = false;
            isBleeding = true;
            startBleedDrops();
        }

        function startBleedDrops() {
            // تكبير عدد الخطوات لجعل النزول بطيء وواضح
            if (bleedStep > 90) {
                isBleeding = false;
                setTimeout(showLoveText, 600);
                return;
            }
            
            let t = bleedStep / 90;
            
            // إيقاف التوهج القديم لرسم القطرات بوضوح
            ctx.shadowBlur = 30;
            ctx.shadowColor = 'rgba(60, 140, 255, 0.7)';

            // نقطة النهاية الموحدة لجميع قطرات الدم (فوق الجذع مباشرة)
            let targetY = cy + 155; 

            for (let p = 0; p < petalEndPoints.length; p++) {
                let end = petalEndPoints[p];
                
                // حساب مسار النزول الحقيقي من رأس البتلة إلى أسفل الجملة
                let currentX = end.startX + (cx - end.startX) * t * 0.7; // تتجه للمركز قليلاً
                let currentY = end.startY + (targetY - end.startY) * t;   // تنزلق للأسفل بانسيابية
                
                // رسم القطرة (شكل بيضاوي يتغير حجمه)
                let size = 5 + t * 5;
                ctx.beginPath();
                ctx.ellipse(currentX, currentY, size, size + 3, end.angle, 0, Math.PI * 2);
                
                // توهج وشفافية عالية عند البداية، ثم تثبت
                let alpha = Math.min(0.9, 0.95 - t * 0.2);
                ctx.fillStyle = `rgba(40, 140, 255, ${alpha})`;
                ctx.fill();
            }
            
            bleedStep++;
            setTimeout(startBleedDrops, 70);
        }

        // ============================================
        // مرحلة الجملة (نيون واضح لا يتداخل)
        // ============================================
        function showLoveText() {
            let text = "I love u samo";
            
            // إيقاف تأثيرات التوهج العالية على النص، لأنها سبب التداخل
            ctx.shadowBlur = 0; 
            
            ctx.font = "bold 48px 'Brush Script MT', 'Great Vibes', 'Comic Sans MS', cursive, sans-serif";
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            let yPos = cy + 160; // تحت الزهرة، فوق الجذع
            let step = 0;
            
            let textInterval = setInterval(() => {
                if (step > text.length) {
                    clearInterval(textInterval);
                    return;
                }
                
                let partialText = text.substring(0, step);
                
                // **تقنية النيون الصافية (رسم النص مرتين)**
                // 1. رسم ظل داكن خلف النص ليعطيه حافة (يعالج مشكلة التداخل)
                ctx.fillStyle = '#1a1a3a'; 
                ctx.fillText(partialText, cx - 1, yPos - 1);
                ctx.fillText(partialText, cx + 1, yPos + 1);
                
                // 2. رسم النص باللون النيون الأزرق الزاهي في المنتصف
                ctx.fillStyle = '#3399ff'; // لون نيون زاهي
                ctx.fillText(partialText, cx, yPos);
                
                // **جعل القطرات الصغيرة تنثر حول الحروف (الدم هو من يرسم)**
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#4d94ff';
                for (let d = 0; d < 6; d++) {
                    let dropX = cx + (Math.random() - 0.5) * (step * 25);
                    let dropY = yPos + (Math.random() - 0.5) * 25;
                    ctx.beginPath();
                    ctx.arc(dropX, dropY, 2 + Math.random() * 4, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(40, 160, 255, ${0.6 + Math.random() * 0.4})`;
                    ctx.fill();
                }
                ctx.shadowBlur = 0; // إعادة التعيين للخطوة القادمة
                
                step++;
            }, 150); // كتابة حرف كل 150 مللي ثانية
        }

        // ============================================
        // حلقة الرسم الرئيسية
        // ============================================
        function drawItemFromQueue() {
            if (!isDrawingFlower) return;

            if (currentIndex >= drawQueue.length) {
                isDrawingFlower = false;
                setTimeout(startBleeding, 500);
                return;
            }

            const item = drawQueue[currentIndex];

            if (item.type === 'stem') {
                ctx.beginPath();
                ctx.moveTo(stemPoints[Math.max(0, item.idx - 1)].x, stemPoints[Math.max(0, item.idx - 1)].y);
                ctx.lineTo(stemPoints[item.idx].x, stemPoints[item.idx].y);
                ctx.strokeStyle = 'rgba(35, 45, 60, 0.7)';
                ctx.lineWidth = 6.5;
                ctx.shadowBlur = 0;
                ctx.stroke();
                ctx.shadowBlur = 12;
            } 
            else if (item.type === 'base') {
                ctx.save();
                ctx.translate(item.x, item.y);
                ctx.beginPath();
                ctx.ellipse(0, 0, item.w, item.h, 0, 0, Math.PI * 2);
                ctx.fillStyle = item.color;
                ctx.fill();
                ctx.restore();
            } 
            else {
                const ring = item;
                const x = cx + ring.distance * Math.cos(ring.angle);
                const y = cy + ring.distance * Math.sin(ring.angle);
                
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(ring.angle + Math.PI / 2);
                
                ctx.beginPath();
                ctx.ellipse(0, 0, ring.w, ring.h, 0, 0, Math.PI * 2);
                ctx.strokeStyle = ring.color;
                ctx.lineWidth = ring.distance < 30 ? 7 : 5;
                ctx.stroke();
                
                ctx.restore();
            }

            currentIndex++;
            setTimeout(drawItemFromQueue, DRAW_DELAY_MS);
        }

        // بدء الرسم
        setTimeout(drawItemFromQueue, 600);

        // إعادة الضبط التلقائي عند تغيير حجم الشاشة
        window.addEventListener('resize', () => {
            // لأفضل تجربة يرجى تحديث الصفحة.
        });

    </script>
</body>
</html>
